name: Cross-Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # AC-09a: npm install -g + xp-gate init on all platforms
  install-init:
    name: Install + Init (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test global install + init
        run: |
          npm install -g ./src/npm-package
          echo "xp-gate installed: $(xp-gate --version)"
          mkdir -p /tmp/test-init-project
          cd /tmp/test-init-project
          git init
          git config user.email "ci@test.com"
          git config user.name "CI"
          xp-gate init
          echo "Hooks installed successfully"
        shell: bash

  # AC-09b: First commit triggers 6 gates
  first-commit-gates:
    name: First Commit Gates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node-version }}'

      - name: Install project dependencies
        run: npm ci || npm install

      - name: First commit triggers gates
        run: |
          rm -rf /tmp/test-commit-project
          mkdir -p /tmp/test-commit-project
          cd /tmp/test-commit-project
          git init
          git config user.email "ci@test.com"
          git config user.name "CI"
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          cp -r $GITHUB_WORKSPACE/githooks .githooks-ref
          bash .githooks-ref/install.sh
          rm -rf .githooks-ref

          # Gate 6: Architecture skip file
          touch .architecture-skip

          # Gate 1 (Code Quality) + Gate 2 (Dup Code) + Gate 4 (Principles):
          echo "export function greet(name: string): string { return 'hello ' + name; }" > test.ts

          # Gate 3 (Complexity): function with multiple branches (CCN ~5, under 10 threshold)
          cat > status.ts << 'TS'
          export function httpStatus(code: number): string {
            if (code === 200) return 'OK';
            if (code === 201) return 'Created';
            if (code === 400) return 'Bad Request';
            if (code === 404) return 'Not Found';
            if (code === 500) return 'Internal Server Error';
            return 'Unknown';
          }
          TS

          # Gate 5 (Tests + Coverage): test file + vitest config
          mkdir -p __tests__
          cat > __tests__/test.test.ts << 'TEST'
          import { describe, it, expect } from 'vitest';
          import { greet } from '../test';
          describe('greet', () => {
            it('returns greeting', () => {
              expect(greet('world')).toBe('hello world');
            });
          });
          TEST

          cat > vitest.config.ts << 'CFG'
          import { defineConfig } from 'vitest/config';
          export default defineConfig({
            test: {
              coverage: {
                provider: 'v8',
                reporter: ['json-summary'],
                thresholds: { global: { lines: 0 } },
              },
            },
          });
          CFG

          # Test for status.ts (ensures coverage includes both source files)
          cat > __tests__/status.test.ts << 'STATUS_TEST'
          import { describe, it, expect } from 'vitest';
          import { httpStatus } from '../status';
          describe('httpStatus', () => {
            it('returns OK for 200', () => { expect(httpStatus(200)).toBe('OK'); });
            it('returns Not Found for 404', () => { expect(httpStatus(404)).toBe('Not Found'); });
            it('returns Unknown for unmapped codes', () => { expect(httpStatus(999)).toBe('Unknown'); });
          });
          STATUS_TEST

          # Install vitest + typescript locally for Gate 5 coverage + Gate 1 tsc check
          # vitest 3.x supports Node 18; vitest 4.x requires Node 20+ (uses node:inspector/promises)
          npm init -y > /dev/null 2>&1
          npm install 'vitest@3' typescript '@vitest/coverage-v8@3' --save-dev > /dev/null 2>&1

          git add -A
          git commit -m "test: first commit triggers 6 quality gates"
        shell: bash

  # AC-10b: Tarball size < 2MB
  tarball-size:
    name: Tarball Size Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tarball size < 2MB
        working-directory: src/npm-package
        run: |
          SIZE=$(npm pack --dry-run --json 2>/dev/null | jq '.[0].size')
          echo "Tarball size: $SIZE bytes"
          if [ "$SIZE" -ge 2097152 ]; then
            echo "FAIL: tarball >= 2MB ($SIZE bytes)"
            exit 1
          fi
          echo "PASS: tarball < 2MB ($SIZE bytes)"
        shell: bash

  # AC-WIN-005: Windows Git Bash hook syntax check (+ detect_os_env validation)
  windows-gitbash-hooks:
    name: Windows Git Bash Hooks
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: bash -n syntax check on all .sh files
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            echo "Checking: $f"
            bash -n "$f" || { echo "FAIL: $f"; failed=1; }
          done < <(find githooks -name '*.sh' -print0)
          echo "---"
          if [ "$failed" -eq 1 ]; then
            echo "FAIL: one or more shell files have syntax errors"
            exit 1
          fi
          echo "PASS: all .sh files pass bash -n"

      - name: bash -n on pre-commit and pre-push
        run: |
          bash -n githooks/pre-commit && echo "PASS: pre-commit"
          bash -n githooks/pre-push && echo "PASS: pre-push"

      - name: Inline detect_os_env() test (expect windows)
        run: |
          result=$(bash -c '
            source githooks/adapter-common.sh
            detect_os_env
          ')
          echo "detect_os_env() returned: $result"
          if [ "$result" != "windows" ]; then
            echo "FAIL: expected 'windows', got '$result'"
            exit 1
          fi
          echo "PASS: detect_os_env() returns '$result' on windows-latest"

      - name: OSTYPE-unset negative test
        run: |
          result=$(bash -c '
            unset OSTYPE
            source githooks/adapter-common.sh
            detect_os_env
          ')
          echo "detect_os_env() with unset OSTYPE returned: $result"
          case "$result" in
            windows) echo "PASS: still detects windows via uname" ;;
            linux|macos) echo "INFO: on non-windows runner, expected: $result" ;;
            *) echo "FAIL: unexpected result '$result'"; exit 1 ;;
          esac

      - name: OSTYPE=cygwin negative test
        run: |
          result=$(bash -c '
            export OSTYPE=cygwin
            source githooks/adapter-common.sh
            detect_os_env
          ')
          echo "detect_os_env() with OSTYPE=cygwin returned: $result"
          if [ "$result" != "windows" ]; then
            echo "FAIL: expected 'windows' for OSTYPE=cygwin, got '$result'"
            exit 1
          fi
          echo "PASS: detect_os_env() correctly handles OSTYPE=cygwin"

  # Mirror Parity Guard: src/npm-package/skills/ and src/npm-package/plugins/ must equal canonical sources
  # Prevents silent divergence between source-of-truth and npm-distributed copies (C-CRIT-2)
  mirror-parity:
    name: Mirror Parity (npm-package vs canonical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync and verify no diff
        run: |
          # Sync canonical sources to npm-package mirror directory
          bash scripts/sync-version.sh
          node src/npm-package/scripts/sync-package-content.js

          # Verify no diff — ignore AGENTS.md header lines (Generated/Commit/Branch differ between CI and local)
          # Only check content-level consistency, not metadata headers
          if git diff --exit-code src/npm-package/skills src/npm-package/plugins; then
            echo "PASS: npm-package mirror matches canonical sources"
          elif git diff src/npm-package/skills src/npm-package/plugins | grep -v '^\+\+\|^---\|^@@\|^-.*Generated\|^-.*Commit\|^-.*Branch\|^-.*Version\|^+.*Generated\|^+.*Commit\|^+.*Branch\|^+.*Version\|^index' | grep -v '^$' | grep -q .; then
            echo ""
            echo "FAIL: src/npm-package mirror has content-level divergence from canonical sources"
            echo "Run locally: bash scripts/sync-version.sh && node src/npm-package/scripts/sync-package-content.js && git add src/npm-package && git commit"
            exit 1
          else
            echo "PASS: npm-package mirror matches canonical (AGENTS.md headers vary by environment — expected)"
          fi
        shell: bash
