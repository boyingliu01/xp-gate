name: Go Mutation Testing

on:
  pull_request:
    paths:
      - 'src/mutation/**'
      - '.github/workflows/mutation-test-go.yml'
  push:
    branches: [main]
    paths:
      - 'src/mutation/**'
      - '.github/workflows/mutation-test-go.yml'
  workflow_dispatch:

jobs:
  go-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install gomutants
        run: go install github.com/szhekpisov/gomutants@latest

      - name: Run Gate M on Go fixture
        run: |
          mkdir -p /tmp/xp-gate-go-fixture
          cd /tmp/xp-gate-go-fixture

          go mod init github.com/xp-gate/test-fixture

          cat > calculator.go << 'GOEOF'
          package calculator

          import "errors"

          func Add(a, b int) int         { return a + b }
          func Subtract(a, b int) int    { return a - b }
          func Multiply(a, b int) int    { return a * b }
          func Divide(a, b int) (int, error) {
              if b == 0 {
                  return 0, errors.New("division by zero")
              }
              return a / b, nil
          }
          GOEOF

          cat > calculator_test.go << 'GOEOF'
          package calculator

          import "testing"

          func TestAdd(t *testing.T) {
              if got := Add(2, 3); got != 5 {
                  t.Fatalf("Add(2, 3) = %d; want 5", got)
              }
          }

          func TestSubtract(t *testing.T) {
              if got := Subtract(5, 3); got != 2 {
                  t.Fatalf("Subtract(5, 3) = %d; want 2", got)
              }
          }

          func TestMultiply(t *testing.T) {
              if got := Multiply(4, 3); got != 12 {
                  t.Fatalf("Multiply(4, 3) = %d; want 12", got)
              }
          }

          func TestDivide(t *testing.T) {
              got, err := Divide(10, 2)
              if err != nil {
                  t.Fatalf("unexpected error: %v", err)
              }
              if got != 5 {
                  t.Fatalf("Divide(10, 2) = %d; want 5", got)
              }
              if _, err := Divide(1, 0); err == nil {
                  t.Fatal("expected division by zero error")
              }
          }
          GOEOF

          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/src/mutation/gate-m.ts" \
            --changed-files "calculator.go" \
            --timeout 180000
