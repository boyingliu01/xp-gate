name: Mutation Testing

on:
  pull_request:
    paths:
      - 'src/principles/**/*.ts'
      - 'stryker.conf.json'
      - 'tsconfig.stryker.json'
      - 'package.json'
      - 'vitest.config.ts'
  push:
    branches: [main]
    paths:
      - 'src/principles/**/*.ts'
      - 'stryker.conf.json'
      - 'tsconfig.stryker.json'
      - 'package.json'
      - 'vitest.config.ts'
  workflow_dispatch:

# Least privilege: read the repo; only the timeout-comment step needs to write,
# and it only comments on the PR. Satisfies CKV2_GHA_1 (no write-all).
permissions:
  contents: read
  pull-requests: write

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the changed-file diff has a merge base
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # Stryker's initial dry run executes the WHOLE vitest suite. That suite
      # includes src/npm-package/lib/__tests__/crap-cli.test.js, which shells out
      # to `lizard`. Without lizard installed the CLI prints
      #   ✗ Could not run lizard. Install it with: pip install --user lizard
      # instead of "No coverage artifact", so the assertion fails and the dry run
      # aborts before a single mutant is generated:
      #   ERROR DryRunExecutor One or more tests failed in the initial test run
      # This workflow only triggers on src/principles/** changes — exactly the
      # scope that pulls the lizard-dependent test in — so the gate was failing on
      # a missing tool rather than on the mutation result.
      #
      # Install it the same way quality-gates.yml installs Gate 3's analyzer:
      # pinned to .lizard-version (#584 — an unpinned lizard re-rolls complexity
      # verdicts), read back and compared (#583 — installing elsewhere in a
      # multi-job workflow does nothing, each job is its own filesystem).
      - name: 'Install analyzer (lizard, pinned to .lizard-version)'
        run: |
          PINNED=$(tr -d ' \t\r\n' < .lizard-version)
          if [ -z "$PINNED" ]; then
            echo "❌ .lizard-version is missing or empty — the test suite's lizard-dependent checks cannot be pinned."
            echo "Failing closed: an unpinned analyzer re-rolls every complexity verdict."
            exit 1
          fi
          echo "Installing lizard==$PINNED (pinned by .lizard-version)..."
          pip install "lizard==$PINNED"
          INSTALLED=$(lizard --version)
          echo "lizard --version -> $INSTALLED"
          if [ "$INSTALLED" != "$PINNED" ]; then
            echo "❌ installed lizard $INSTALLED does not match the pinned $PINNED."
            echo "The dry run would then exercise a different analyzer than the baseline was built with."
            exit 1
          fi

      # Stryker's initial dry run executes the test suite, and that suite includes
      # plugins/dsh/src/skills.test.ts, which asserts plugins/dsh/skills/ exists
      # and matches the repo's skills/. That directory is a PREPACK ARTIFACT --
      # .gitignore:150 lists it -- so on a clean checkout the assertion failed
      # before any mutant was generated:
      #
      #   ERROR DryRunExecutor One or more tests failed in the initial test run:
      #     bundled skills ships every repo skill as a directory
      #     expected false to be true
      #
      # Run the prepack script itself, exactly as quality-gates.yml does for #586.
      - name: Bundle plugin skills (prepack artifact, gitignored)
        if: hashFiles('plugins/dsh/scripts/prepack.cjs') != ''
        run: node plugins/dsh/scripts/prepack.cjs

      # plugins/dsh/lib/ is a SECOND gitignored artifact (.gitignore:164), and one
      # prepack does not produce: it is tsc output. src/npm-package/scripts/__tests__/
      # sync-package-content.test.js spawns sync-package-content.js, whose
      # syncPlugins() ends with assertDshBundleEntry() -- a deliberate fail-closed
      # guard, because the published package exports "./dsh" from that path and a
      # missing entry means the bundle would not load on a user's machine.
      #
      # Skipping the build made that guard fire as:
      #
      #   ERROR DryRunExecutor One or more tests failed in the initial test run:
      #     syncHooks syncHooks copies pre-commit to hooks dir
      #       sync script must exit 0: expected false to be true
      #
      # which names a hook-copy assertion and says nothing about a missing tsc
      # output, so it read as a flaky test rather than a missing prerequisite.
      # quality-gates.yml already builds this for the same reason (#586 follow-up);
      # this job ran the dry run without it, so every run since has failed here.
      - name: Build dsh plugin (tsc artifact, gitignored)
        run: |
          set -euo pipefail
          # No `if: hashFiles(...)` guard here on purpose. A conditional skip would be
          # SILENT: if the tsconfig were ever renamed, this step would vanish, the tsc
          # artifact would be missing again, and the failure would resurface as the
          # same misleading "syncHooks ... sync script must exit 0" above. Failing
          # loudly on a missing prerequisite beats skipping it quietly.
          test -f plugins/dsh/package.json \
            || { echo "::error::plugins/dsh/package.json is missing — this job cannot build the plugin."; exit 1; }

          # plugins/dsh is not a workspace and its package-lock.json is gitignored,
          # so root `npm ci` does not install its dependencies. Install only when
          # they are absent, so a cache hit is not charged a network round trip.
          if [[ ! -d plugins/dsh/node_modules ]]; then
            npm --prefix plugins/dsh install --no-audit --no-fund
          fi
          npm --prefix plugins/dsh run build
          # Assert the tsc artifact itself. The mirror under src/npm-package/ is
          # written by syncPlugins() during the test, so checking it here would
          # test the wrong thing at the wrong time.
          test -f plugins/dsh/lib/index.js \
            || { echo "::error::plugins/dsh build produced no lib/index.js"; exit 1; }

      # The Stryker dry run executes the WHOLE vitest suite, including the
      # in-tree drift guards. When one of those guards fails, Stryker reports
      # only the test name and "expected [ Array(1) ] to deeply equal []" -- the
      # single element that would say WHAT drifted is collapsed. Print the
      # actual drift here so a failing dry run is diagnosable from the log
      # instead of requiring a re-run with extra instrumentation.
      - name: Snapshot mirror drift (diagnostic)
        run: |
          set -uo pipefail
          echo "--- git status (tracked changes) ---"
          git status --porcelain | head -50
          echo "--- src/principles vs src/npm-package/principles ---"
          diff -rq src/principles src/npm-package/principles 2>&1 | head -30 || true
          echo "--- end ---"

      - name: Determine changed principles files
        id: changed
        run: |
          set -euo pipefail
          # Scope mutation to the files this change actually touched. Mutating all
          # of src/principles/** is ~2014 mutants (~2h of work) and cannot finish
          # inside the 45-min job budget -- it was cancelled on every run. This
          # mirrors how the pre-push config already works incrementally.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            RANGE="$BASE...HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi

          # `:(glob)` is required: a bare `src/principles/**/*.ts` pathspec does NOT
          # match top-level files like boy-scout.ts -- it silently skipped the most
          # important changed file when tested against this very branch.
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$RANGE" -- ':(glob)src/principles/**/*.ts' \
            | grep -v -E '\.test\.ts$|\.d\.ts$|/adapters/' || true)

          if [ -z "$CHANGED" ]; then
            echo "No mutable principles files changed -- skipping mutation."
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # Stryker's --mutate takes a COMMA-SEPARATED list, not a JSON array.
            # Passing JSON makes it warn "No files found for mutation" and mutate
            # nothing while still exiting 0 -- a silent no-op gate.
            LIST=$(printf '%s' "$CHANGED" | paste -sd, -)
            echo "Mutating: $LIST"
            echo "files=$LIST" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mutation tests
        id: mutation
        if: steps.changed.outputs.skip != 'true'
        run: |
          # Pass the changed-file list through so the run stays proportional to
          # the change. --mutate overrides the config's glob.
          npx stryker run --mutate "${{ steps.changed.outputs.files }}" &
          STRYKER_PID=$!

          # Watchdog: warn when approaching the 45-minute CI timeout
          WARNED=0
          while kill -0 $STRYKER_PID 2>/dev/null; do
            sleep 60
            ELAPSED=$((SECONDS / 60))
            if [ "$ELAPSED" -ge 35 ] && [ "$WARNED" -eq 0 ]; then
              echo "::warning::Mutation testing has run ${ELAPSED} min — approaching 45 min CI timeout. Consider increasing timeout or optimizing slow tests."
              WARNED=1
            fi
          done

          wait $STRYKER_PID
          exit_code=$?
          echo "duration_seconds=$SECONDS" >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30

      - name: Comment on timeout failure
        if: failure() && steps.mutation.outputs.duration_seconds != '' && steps.mutation.outputs.duration_seconds >= 2400
        uses: actions/github-script@v7
        with:
          script: |
            const duration = parseInt(process.env.DURATION || '0', 10);
            const minutes = Math.round(duration / 60);
            const body = [
              '⏰ **Mutation testing timed out**',
              '',
              `Duration: ${minutes} minutes (limit: 45 min)`,
              '',
              '**Likely causes:**',
              '- Recent changes to `src/core/` or `src/principles/` increased test count',
              '- New tests have long runtimes (>30s each)',
              '- Stryker config timeout needs tuning',
              '',
              '**Suggested actions:**',
              '- Run `npm run test:mutation` locally to reproduce',
              '- Consider splitting critical-paths into separate matrix jobs',
              '- See [#150](../../issues/150) for context on this watchdog',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            }).catch(() => {
              // Not a PR (push event) — skip comment
              console.log('Not a PR context, skipping comment');
            });
        env:
          DURATION: ${{ steps.mutation.outputs.duration_seconds }}
