# Architecture Configuration for Gate 6
# Version: 2

# NOT ENFORCED: layers are enforced by our checker, rules: is enforced by NOTHING.
#
#   layers:  IS enforced -- by githooks/gate-6-layers.sh, our own checker.
#   rules:   is enforced by nothing. It is planning prose only.
#
#   The rules block uses our own schema, not archlint-s, and archlint reads
#   .archlint.yaml instead. Measured archlint 0.16.0: a project with
#   allowedImports empty that imports across layers yields only Dead Code
#   findings, never a layer violation. ARCH-001..014 are planning numbers with
#   no implementation. Do not believe the rules block protects you.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE DESCRIBES **XP-GATE'S OWN** LAYERING, NOT A BUSINESS APPLICATION'S
# ─────────────────────────────────────────────────────────────────────────────
#
# Version 1 of this file declared the canonical Clean Architecture five
# (domain / application / infrastructure / presentation / shared) under
# `src/`. None of those directories has ever existed in this repository.
#
# Measured 2026-11-19 with `bash githooks/gate-6-layers.sh`:
#
#     ⚠️  0 of 774 scanned file(s) match any of the 4 declared layer(s)
#         reason: layer_config_matches_no_files
#
# That was the state for roughly 207 days (2026-04-15 → 2026-11-08). It is the
# exact defect this gate exists to catch, applied to the gate's own repository:
# a declaration that describes a system nobody built, which therefore protects
# nothing while reading as configuration. The checker reported it honestly
# (rc=3, not rc=0) — the failure was that nobody ran it against this repo.
#
# ─── WHAT XP-GATE ACTUALLY IS ───────────────────────────────────────────────
#
# xp-gate is not a request-serving application. It is a **plugin / toolchain
# collection** invoked from inside other repos:
#
#   * `githooks/`  — the product core: bash gate bodies run by git at commit/push
#   * `src/`       — the TypeScript engines the gates shell out to
#   * `scripts/`   — build, mirror-sync and self-verification tooling
#   * `skills/`    — canonical agent-instruction markdown (prompt 'source')
#   * `plugins/`   — five platform wrappers (claude-code, opencode, qoder, dsh, …)
#   * `src/npm-package/` — GENERATED mirror tree, shipped to npm
#
# The real layering invariant is therefore NOT "domain must not import infra".
# It is:
#
#   core  ←  platform wrappers        (plugins depend on core, never the reverse)
#   core  ←  tooling                  (scripts operate ON the product)
#   generated mirrors depend on canonical sources, never the reverse
#
# Concretely, the invariant that has actually been violated in this repo
# (measured 2026-11-19, 3 sites) is:
#
#   scripts/__tests__/  importing FUNCTIONALITY from `src/npm-package/`
#   rather than from its canonical source. Tests then verify the generated
#   copy, so a divergence between mirror and canonical is invisible to the
#   test that should have caught it.
#
# See `docs/adr/0003-xp-gate-declares-its-own-layers.md` once written.
#
# ─── STILL TRUE: the `rules:` block below is NOT enforced ───────────────────
#
# `layers:` IS enforced — by githooks/gate-6-layers.sh (xp-gate's own checker),
# not by archlint. `rules:` is NOT enforced by anything:
#
#   1. `rules:` uses xp-gate's own schema, not archlint's. archlint reads
#      `.archlint.yaml` (keys `ignore:` / `entry_points:` / `rules:`), which is
#      a different schema; that file is beside this one.
#   2. Measured (archlint 0.16.0): a project with `allowedImports: []` that
#      imports across layers yields only Dead Code findings, no layer
#      violations. archlint HAS a `layer_violation` detector, but it defaults to
#      disabled and does not read this file's `layers:`.
#   3. `ARCH-001`~`ARCH-014` are planning numbers with no implementation.
#      `grep -rn "ARCH-0" src/` returns only an unrelated `REQ-ARCH-001-02`
#      test label.
#
# Do not believe the `rules:` block protects your code.
#
# Installation:
#   npm install -g @archlinter/cli
#   npx @archlinter/cli scan . --config .archlint.yaml   # note: native config

version: 2

# Layer definitions — XP-GATE'S OWN LAYERS (see file header).
#
# Semantics used by githooks/gate-6-layers.sh:
#   * longest matching `pattern` wins (nesting resolves to the deepest layer)
#   * a layer whose patterns match no file is config/reality drift, not a pass
#   * `allowedImports` / `forbiddenImports` accept TWO forms, and the choice
#     matters:
#       - a bare layer name   ("engines")   -- matched against the destination
#                                            LAYER, unambiguous
#       - a path glob         ("src/**")    -- matched against the target PATH
#
#   TRAP: a path glob is matched against the resolved target path, NOT against
#   the destination layer. So `allowedImports: ["src/**"]` also permits
#   `src/npm-package/**` even when that path is a DIFFERENT layer, because the
#   glob never consults layer membership. Nested layers are silently swallowed.
#   Measured 2026-11-19 while writing this file: a layer granting "src/**"
#   granted the generated mirror too, and a deliberate violation passed.
#   Use layer names whenever layers nest. Use path globs only when the glob is
#   narrower than every layer it could reach.
#
#   `forbiddenImports` is checked BEFORE `allowedImports`: an explicit denial is
#   never cancelled by a broader grant. (Until 2026-11-19 it was parsed into a
#   TSV column that nothing read, so the field enforced nothing at all.)
#
# Order here is presentational; precedence comes from pattern specificity.
layers:
  # ── Layer 0: generated output ────────────────────────────────────────────
  # Generated output. Only the parts of src/npm-package that are BYTE COPIES
  # of another tree -- adapters/ hooks/ skills/ plugins/ gates/ -- which are
  # regenerated at prepack from githooks/, skills/ and plugins/.
  #
  # src/npm-package/lib/** and src/npm-package/scripts/** are NOT mirrors.
  # Measured 2026-11-19: detect-deps.js, sprint-state-manager.js and
  # gate-identity.js each exist in exactly ONE place on disk, and that place is
  # src/npm-package/. They are the canonical source the product ships.
  #
  # An earlier revision declared ALL of src/npm-package/** as generated, which
  # produced 7 false violations on this very repo. A layer model wrong in the
  # overly-strict direction is still wrong, and it is why this config needs the
  # same mutation test as the checker: a config that accuses innocent code gets
  # baselined, and a baselined config stops being read.
  generated:
    patterns:
      - "src/npm-package/adapters/**"
      - "src/npm-package/hooks/**"
      - "src/npm-package/skills/**"
      - "src/npm-package/plugins/**"
      - "src/npm-package/gates/**"
      - "dist/**"
      - "coverage/**"
    description: "Byte-copies regenerated at prepack, plus build output. Never a functional dependency."
    allowedImports: []
    forbiddenImports: []

  # ── Layer 1: product core (bash hook layer) ──────────────────────────────
  # The gate bodies and driver that git actually executes. This is the product.
  # It must never depend on platform wrappers or on generated trees.
  hooks:
    patterns: ["githooks/**"]
    description: "Gate bodies, driver, registry, adapters. The executable core."
    allowedImports: ["hooks", "engines"]
    forbiddenImports: ["platforms", "generated"]

  # ── Layer 2: product core (TypeScript engines) ───────────────────────────
  # Engines the gate bodies shell out to. May not depend on the wrappers or on
  # the generated mirror.
  engines:
    patterns: ["src/**"]
    description: "TypeScript analysis engines invoked by gates."
    allowedImports: ["engines"]
    forbiddenImports: ["platforms", "generated"]

  # ── Layer 2b: tests inside the shipped engines ───────────────────
  # Nested inside `engines`: `src/**/__tests__/**` is a strict prefix superset,
  # so the longest-pattern rule resolves these files HERE rather than to
  # `engines`. They exist because a test that verifies a generated artifact has
  # to run the generator, which is a legitimate engine -> tooling edge.
  #
  # Declaring it as its own layer, rather than adding the generator path to
  # `engines.allowedImports`, is the point: allowedImports matches the TARGET
  # path, so granting "scripts/generate-deploy-manifest" there would also grant
  # it to every PRODUCTION file under lib/ — measured 2026-11-19, a production
  # import passed. A source-scoped exception has to be a layer, because that is
  # the only construct that scopes by the importing file.
  engine-tests:
    patterns: ["src/**/__tests__/**"]
    description: "Tests shipped inside the engines; may invoke build tooling."
    allowedImports: ["engines", "engine-tests", "tooling"]
    forbiddenImports: ["platforms", "generated"]
  # ── Layer 3: platform wrappers ───────────────────────────────────────────
  # Thin adapters that ship the core to claude-code / opencode / qoder / dsh.
  # Direction is one-way: wrappers depend on core, core never learns about them.
  platforms:
    patterns: ["plugins/**"]
    description: "Per-platform plugin wrappers around the core."
    allowedImports: ["platforms"]
    forbiddenImports: []

  # ── Layer 4: self-verification tooling ───────────────────────────────────
  # Build, mirror-sync, and the test suites that verify xp-gate itself. Operates
  # ON the product, so it may read any core layer — but it may not reach into
  # the generated mirror for functionality (see `generated` above).
  tooling:
    patterns: ["scripts/**"]
    description: "Build, sync and self-verification tooling."
    allowedImports: ["hooks", "engines", "platforms", "instructions", "tooling"]
    forbiddenImports: ["generated"]

  # ── Layer 5: canonical agent instructions ────────────────────────────────
  # Prompt source of truth. Markdown; imports nothing.
  instructions:
    patterns: ["skills/**"]
    description: "Canonical agent-instruction markdown."
    allowedImports: []
    forbiddenImports: []

# Rule activation and severity
# 
# Severity levels:
#   - error: Blocks commit, must be fixed immediately
#   - warning: Shows warning but allows commit
#   - info: Informational only, no blocking
#
# Architecture Rules:
#   （以下均为规划描述，当前无实现 — 见文件头 NOT ENFORCED 说明）
#   ARCH-001: Domain isolation - Domain must not import from outer layers
#   ARCH-002: Application boundary - Application must not import from Infrastructure/Presentation
#   ARCH-003: Presentation boundary - Presentation must not import Domain directly
#   ARCH-004: Infrastructure boundary - Infrastructure must not import Presentation
#   ARCH-005: Cross-layer cycles - No circular dependencies across layers
#   ARCH-006: Within-layer cycles - No circular dependencies within same layer
#   ARCH-007: Module-level cycles - No circular dependencies between modules
#   ARCH-008: Repository location - Repositories must be in Infrastructure layer
#   ARCH-009: Service location - Domain services must be in Domain layer
#   ARCH-010: Controller location - Controllers must be in Presentation layer
#   ARCH-011: LCOM threshold - Lack of Cohesion of Methods metric
#   ARCH-012: CBO threshold - Coupling Between Objects metric
#   ARCH-013: Fan-out threshold - Number of outgoing dependencies
#   ARCH-014: Fan-in threshold - Number of incoming dependencies
#
# ⚠️ 本块在 archlint 0.16 下**不被执行**。`enabled: true` 是规划意图，不是现状。
#    真实原因见文件头：archlint 不从本文件读取规则定义。
#    要真正启用某项检查，改的是 `.archlint.yaml` 的 `rules:` 块（archlint 原生格式）。

rules:
  ARCH-001:  # Domain isolation
    enabled: true
    severity: error
    description: "Domain layer must not import from Infrastructure/Application/Presentation"
    
  ARCH-002:  # Application boundary
    enabled: true
    severity: error
    description: "Application layer must not import from Infrastructure/Presentation"
    
  ARCH-003:  # Presentation to Domain boundary
    enabled: true
    severity: error
    description: "Presentation layer must not import from Domain directly (must go through Application)"
    
  ARCH-004:  # Infrastructure boundary
    enabled: true
    severity: error
    description: "Infrastructure layer must not import from Presentation"
    
  ARCH-005:  # Cross-layer cycles
    enabled: true
    severity: error
    description: "No circular dependencies across different layers"
    
  ARCH-006:  # Within-layer cycles
    enabled: false  # Disable for gradual adoption
    severity: warning
    description: "No circular dependencies within the same layer"
    
  ARCH-007:  # Module-level cycles
    enabled: false  # Advanced, optional
    severity: warning
    description: "No circular dependencies between modules"
    
  ARCH-008:  # Repository location
    enabled: true
    severity: error
    description: "Repository interfaces in Domain, implementations in Infrastructure"
    
  ARCH-009:  # Domain service location
    enabled: true
    severity: error
    description: "Domain services must reside in Domain layer"
    
  ARCH-010:  # Controller location
    enabled: true
    severity: error
    description: "Controllers/Handlers must reside in Presentation layer"

  # Coupling metrics (optional, advanced)
  ARCH-011:  # LCOM
    enabled: false
    severity: warning
    threshold: 0.8
    description: "Lack of Cohesion of Methods - high values indicate god classes"
    
  ARCH-012:  # CBO
    enabled: false
    severity: warning
    threshold: 10
    description: "Coupling Between Objects - high values indicate tight coupling"
    
  ARCH-013:  # Fan-out
    enabled: false
    severity: warning
    threshold: 7
    description: "Number of outgoing dependencies"
    
  ARCH-014:  # Fan-in
    enabled: false
    severity: info
    threshold: 20
    description: "Number of incoming dependencies"

# Baseline for gradual adoption (like Boy Scout Rule in Gate 6)
# 
# IMPORTANT: New projects should start with enabled: false
# Baseline mode is ONLY for historical projects with existing violations
#
# How it works:
#   1. Run initial analysis to capture existing violations
#   2. Store violations in .architecture-baseline.json
#   3. Future commits check against baseline - new violations are blocked
#   4. Existing violations can be fixed incrementally
#
# To enable baseline mode for existing project:
#   npx @archlinter/cli baseline --init
baseline:
  enabled: true  # Enable for gradual adoption on existing project
  file: ".architecture-baseline.json"
  mode: "ratchet"  # Allow existing violations, block new ones

# Output configuration
output:
  format: sarif  # sarif | json | console
  file: "architecture-report.sarif.json"
  
  # SARIF format is recommended for:
  #   - GitHub Actions integration
  #   - VS Code SARIF viewer extension
  #   - Consistent with Gate 4 Principles output

# Integration settings
integration:
  # Skip Gate 6 for documentation-only projects
  # (Projects with only .md, .txt, .rst files)
  documentationOnlySkip: true
  
  # Zero tolerance - block commit if architecture tool is missing
  # Set to false to allow commits without tool (WARNING mode)
  toolRequired: true
  
  # Language-specific settings
  #
  # ⚠️ 本块无消费方。实测 `grep -rn "minVersion" src/ githooks/` 的命中全部无关
  #    （python-health 的 Python 版本检查、detect-deps 的 skill 依赖检测），
  #    没有任何代码读取这里的 tool / minVersion。
  #    因此修改它不会让 Gate 6 改用别的架构工具，也不会触发版本校验。
  #    实际的语言支持判断在 githooks/pre-commit 的 Gate 6 探测逻辑里，与本块无关。
  languages:
    typescript:
      tool: "@archlinter/cli"
      minVersion: "0.16.0"
      
    python:
      tool: "import-linter"
      minVersion: "2.0.0"
      
    go:
      tool: "arch-go"
      minVersion: "1.7.0"
      
    java:
      tool: "archunit"
      minVersion: "1.0.0"
      
    cpp:
      # C++ is not supported in Phase 1
      # Requires explicit skip marker: .skip-architecture-cpp
      supported: false
      skipMarker: ".skip-architecture-cpp"
