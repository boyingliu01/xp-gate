specification:
  title: "分层自动化测试防护网"
  issue: "#359"
  version: 1
  requirements:
    - id: REQ-001
      title: "@test-type 注解检测"
      description: "扩展 detectTestLayer() 支持 @test-type 注解，注解优先级高于路径推断"
      priority: critical
      acceptance_criteria:
        - id: AC-001
          criteria: "detectTestLayer() 解析 @test-type unit|integration|e2e 注解"
        - id: AC-002
          criteria: "注解优先级高于文件路径模式推断"
        - id: AC-003
          criteria: "无注解时回退到现有路径模式检测"
        - id: AC-004
          criteria: "支持 JSDoc 块注释和行注释两种格式"
      test_type: unit

    - id: REQ-002
      title: "分层测试统计报告器"
      description: "新增 layered-test-reporter.ts，按层统计测试文件分布和 mock 密度"
      priority: critical
      acceptance_criteria:
        - id: AC-005
          criteria: "输出 unit/integration/e2e/unknown 四分类统计"
        - id: AC-006
          criteria: "每层统计测试文件数量和 mock 密度"
        - id: AC-007
          criteria: "报告作为可观测性输出，不 BLOCK 流程"
      test_type: unit
      depends_on: [REQ-001]

    - id: REQ-003
      title: "E2E 流程贯通验证器"
      description: "新增 e2e-flow-validator.ts，检测 E2E 测试中的系统内 mock 违规"
      priority: high
      acceptance_criteria:
        - id: AC-008
          criteria: "检测 E2E 测试文件中对系统内模块的 mock 调用"
        - id: AC-009
          criteria: "使用 scope-scanner.ts 的 isExternalImport 判断内外部依赖"
        - id: AC-010
          criteria: "无 E2E 测试文件时返回 skip（不产生噪音）"
        - id: AC-011
          criteria: "Phase 1 输出 WARNING，不 BLOCK"
      test_type: integration
      depends_on: [REQ-001]

    - id: REQ-004
      title: "Gate 5 分层集成"
      description: "pre-commit 阶段集成 @test-type 注解校验 + E2E mock 检查"
      priority: high
      acceptance_criteria:
        - id: AC-012
          criteria: "新测试文件无 @test-type 注解 → BLOCK"
        - id: AC-013
          criteria: "旧测试文件无注解 → 不追溯（向后兼容）"
        - id: AC-014
          criteria: "E2E 测试中系统内 mock → WARNING（Phase 1）"
        - id: AC-015
          criteria: "mock 密度分层管控仍由 Gate M2/M3 负责（不在 Gate 5 重复）"
      test_type: integration
      depends_on: [REQ-001, REQ-003]

    - id: REQ-005
      title: "分层标注规范文档"
      description: "新增 docs/test-layer-annotation-guide.md"
      priority: low
      acceptance_criteria:
        - id: AC-016
          criteria: "文档定义 @test-type 注解格式和使用规范"
        - id: AC-017
          criteria: "文档说明三层测试体系的定位和 mock 策略"
      test_type: unit

  design_decisions:
    - id: DD-001
      decision: "注解优先，路径回退"
      rationale: "显式注解比路径推断更准确，路径模式作为向后兼容回退"
    - id: DD-002
      decision: "不做源代码覆盖率分层聚合"
      rationale: "覆盖率数据源不含测试→源文件映射，实现复杂度高，覆盖率不是目标"
    - id: DD-003
      decision: "pre-commit 做注解校验，pre-push 做统计报告"
      rationale: "pre-commit 只有 staged files，适合格式校验；分层统计需要完整测试运行"
    - id: DD-004
      decision: "mock 密度分层管控归 Gate M2/M3"
      rationale: "避免与现有 Gate M3 职责重叠，Gate 5 聚焦注解规范和 E2E 贯通"
    - id: DD-005
      decision: "新文件 BLOCK，旧文件不追溯"
      rationale: "向后兼容，避免大规模迁移成本"
    - id: DD-006
      decision: "e2e-flow-validator.ts 放入 src/mock-policy/"
      rationale: "与现有 mock 策略检查逻辑紧密相关，减少模块膨胀"
