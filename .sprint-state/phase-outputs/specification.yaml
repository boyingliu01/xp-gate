requirements:
  - id: REQ-TDD-001
    title: Gate 5a 升级 — Test-First BLOCK (pre-commit)
    description: |
      修改现有 Gate 5a（githooks/pre-commit 第 948-1061 行），将 WARNING 升级为 BLOCK（仅对新增 .ts/.tsx 文件）。
      修改已有文件保持 WARNING（兼容存量项目）。支持豁免文件和豁免注解。
    priority: high
    layer: pre-commit
    scope: TypeScript only (.ts/.tsx)
    acceptance_criteria:
      - id: AC-TDD-001-01
        description: 新增 .ts/.tsx 文件无对应 .test.ts/.test.tsx → BLOCK
      - id: AC-TDD-001-02
        description: 新增 .ts/.tsx 文件有对应 .test.ts/.test.tsx → PASS
      - id: AC-TDD-001-03
        description: 修改已有 .ts/.tsx 文件无对应测试 → WARNING（不阻断）
      - id: AC-TDD-001-04
        description: 豁免文件（index.ts, types.ts, interfaces.ts, constants.ts, .d.ts, .pyi）→ PASS
      - id: AC-TDD-001-05
        description: "@no-test-required: <reason>（理由 ≥10 字符）→ PASS"
      - id: AC-TDD-001-06
        description: "@no-test-required: short（理由 <10 字符）→ BLOCK"
      - id: AC-TDD-001-07
        description: "@no-test 注解（deprecated alias）→ PASS（向后兼容）"
      - id: AC-TDD-001-08
        description: "逃生阀：SKIP_GATE_5A_BLOCK=1 环境变量（非 main/master 分支）→ PASS + audit log"
      - id: AC-TDD-001-09
        description: "逃生阀：SKIP_GATE_5A_BLOCK=1 在 main/master 分支 → BLOCK（不生效）"
      - id: AC-TDD-001-10
        description: ".tdd-adoption.yaml gracePeriod 内 → WARNING（不阻断）"
      - id: AC-TDD-001-11
        description: ".tdd-adoption.yaml gracePeriod 外 → BLOCK"
      - id: AC-TDD-001-12
        description: "性能：100 个文件 < 500ms"
      - id: AC-TDD-001-13
        description: "审计日志：逃生阀使用记录到 .xp-gate/reports/escape-valve-log.json"
      - id: AC-TDD-001-14
        description: "紧急逃生：.xp-gate/emergency.yaml 配置支持（senior 审批 + 过期时间）"

  - id: REQ-TDD-002
    title: Gate M2 阈值调整 — Mock 密度增强 (pre-push)
    description: |
      修改现有 Gate M2（githooks/pre-push 第 319-345 行），将 BLOCK 阈值从 50% 降至 30%。
      支持 .mockpolicyrc 按层配置差异化阈值。本 sprint 以 WARNING 模式运行（Phase 1）。
    priority: high
    layer: pre-push
    scope: TypeScript only (.ts/.tsx)
    acceptance_criteria:
      - id: AC-TDD-002-01
        description: "Mock 密度 ≤29% → PASS"
      - id: AC-TDD-002-02
        description: "Mock 密度 >30% 无 @mock-justified → WARNING（Phase 1）/ BLOCK（Phase 2）"
      - id: AC-TDD-002-03
        description: "Mock 密度 >30% 有 @mock-justified: <reason>（理由 ≥10 字符）→ PASS"
      - id: AC-TDD-002-04
        description: "Mock 密度 >30% 有 @mock-justified: short（理由 <10 字符）→ WARNING/BLOCK"
      - id: AC-TDD-002-05
        description: ".mockpolicyrc layers.unit.maxMockDensity: 100 → unit 层不限制"
      - id: AC-TDD-002-06
        description: ".mockpolicyrc layers.integration.maxMockDensity: 30 → integration 层 30%"
      - id: AC-TDD-002-07
        description: ".mockpolicyrc mock-threshold: 40 → 全局阈值 40%"
      - id: AC-TDD-002-08
        description: "跨语言：Python MagicMock 正确检测"
      - id: AC-TDD-002-09
        description: "分阶段实施：Phase 0 基线分析 → Phase 1 WARNING → Phase 2 根据误报率决定 BLOCK"
      - id: AC-TDD-002-10
        description: "基线文件：.mock-density-baseline.json 生成"

  - id: REQ-TDD-003
    title: ralph-loop TDD 强化
    description: |
      修改 skills/ralph-loop/SKILL.md 和 skills/sprint-flow/references/phase-2-build.md，
      在 REQ 完成前增加 test-first 原则验证，更新 Gate 引用表。
    priority: medium
    layer: skill
    scope: skill documentation
    acceptance_criteria:
      - id: AC-TDD-003-01
        description: "ralph-loop SKILL.md：REQ 完成检查清单增加 test-first 验证"
      - id: AC-TDD-003-02
        description: "ralph-loop SKILL.md：progress.log 记录格式增加 test_first_compliant 字段"
      - id: AC-TDD-003-03
        description: "phase-2-build.md：Gate 引用表更新（Gate 5a-BLOCK, Gate M2 30%）"
      - id: AC-TDD-003-04
        description: "phase-2-build.md：增加 TDD 强制执行章节"
      - id: AC-TDD-003-05
        description: "文档更新：AGENTS.md Gate 表更新"
      - id: AC-TDD-003-06
        description: "文档更新：README.md 门禁详解更新"
      - id: AC-TDD-003-07
        description: "文档更新：QUALITY-GATES-CODE-OF-CONDUCT.md 门禁表更新"
      - id: AC-TDD-003-08
        description: "文档更新：CHANGELOG.md 破坏性变更说明"

  - id: REQ-TDD-004
    title: BATS 测试
    description: |
      新增 BATS 测试覆盖 Gate 5a-BLOCK 和 Gate M2 阈值调整的所有场景。
    priority: high
    layer: test
    scope: githooks/__tests__/
    acceptance_criteria:
      - id: AC-TDD-004-01
        description: "gate-5a-block.test.bats：14 个测试场景全部通过"
      - id: AC-TDD-004-02
        description: "gate-m2-threshold.test.bats：10 个测试场景全部通过"

  - id: REQ-TDD-005
    title: 自动化防漂移
    description: |
      scripts/prepack.cjs 增加 docs-drift-check 步骤，对比 AGENTS.md Gate 表与 pre-commit 脚本实际 Gate 数量。
    priority: low
    layer: automation
    scope: scripts/
    acceptance_criteria:
      - id: AC-TDD-005-01
        description: "prepack.cjs 增加 docs-drift-check 步骤"
      - id: AC-TDD-005-02
        description: "Gate 表不一致时报错并阻断 publish"

taste_decisions:
  - item: Gate 5a 升级方式
    decision: 原地修改（不抽成独立文件）
  - item: 语言范围
    decision: 本次 sprint 只做 TypeScript（.ts/.tsx）
  - item: Gate M2 阈值
    decision: 50% → 30%，支持 .mockpolicyrc 按层配置
  - item: REQ-TDD-003 优先级
    decision: 本 sprint 做，但优先级最低
  - item: 注解统一
    decision: "@no-test-required: <reason>（≥10字符），@no-test 作为 deprecated alias"
  - item: 逃生阀治理
    decision: 常规（SKIP_GATE_5A_BLOCK=1 + audit log + 非main分支限制）+ 紧急（.xp-gate/emergency.yaml + senior审批）
  - item: 分阶段实施
    decision: "Phase 0（baseline分析）→ Phase 1（WARNING模式）→ Phase 2（根据误报率决定BLOCK）"
