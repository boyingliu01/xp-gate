title = "XP-Gate Secret Detection Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for XP-Gate project"

paths = [
  # Lock files and dependencies
  '''(?:^|/)(?:package-lock\.json|yarn\.lock|pnpm-lock\.yaml|poetry\.lock|Pipfile\.lock)$''',
  '''(?:^|/)node_modules(?:/.*)?$''',
  '''(?:^|/)vendor(?:/.*)?$''',

  # Build artifacts
  '''(?:^|/)(?:dist|build|coverage|\.coverage)(?:/.*)?$''',
  '''\.(?:jpg|jpeg|png|gif|svg|pdf|zip|tar|gz|bin)$''',

  # IDE and cache files
  '''\.(?:vscode|idea|mypy_cache|pytest_cache|tox)(?:/.*)?$''',
  '''\.git(?:/.*)?$''',

  # Test fixtures (intentional test credentials)
  '''(?:^|/)test(?:s)?/(?:fixtures?|data|mock)(?:/.*)?$''',
  '''(?:^|/)__tests__/(?:fixtures?|data)(?:/.*)?$''',

  # The hook-behaviour recorder must WRITE a secret-shaped fixture into a temp
  # repo, because its whole job is to record that Gate 8 blocks on it. This is
  # a path-scoped exemption for that ONE generator, not for scripts/ generally:
  # a real credential pasted into any other script is still caught.
  #
  # Scope it no wider than this. If this entry ever grows to a directory, the
  # fixture stops proving anything -- the scenario would record "no secrets
  # detected" and the blocking path would go untested while staying green.
  '''^scripts/record-hook-behaviour\.cjs$''',

  # Same argument, same scope: the availability-matrix suite asserts that Gate 8
  # BLOCKS on a GitHub PAT, so it has to contain a PAT-shaped string. Exempt the
  # one file, not githooks/__tests__/ as a directory -- a fixture permitted at
  # directory scope would let a real credential land in any neighbouring suite.
  #
  # The literal below is `ghp_` + 36 characters that spell nothing; if this entry
  # ever needs widening, re-read the note above before doing it.
  '''^githooks/__tests__/gate-availability-matrix\.test\.bats$''',

  # Documentation
  '''\.md$''',
  '''docs/(?:.*)$''',
  '''(?:^|/)examples?(?:/.*)?$''',
]

regexes = [
  # Test/example values
  '''(?i)(?:test|example|dummy|fake|placeholder|changeme)''',
  # Local development patterns
  '''(?:localhost|127\.0\.0\.1|0\.0\.0\.0)''',
  # Example API keys
  '''(?:your-|my-)?(?:api|secret|key|token)-(?:here|example)''',
  # Common test credentials
  '''(?:password|pass|pwd)\s*[=:]\s*(?:test|123|password)''',
]

stopwords = [
  "EXAMPLE",
  "example",
  "PLACEHOLDER",
  "placeholder",
  "CHANGEME",
  "changeme",
  "test",
  "TEST",
  "dummy",
  "DUMMY",
  "fake",
  "FAKE",
]
