    - id: DD-001
      decision: 走薄桥（方案 A）在 ctx.tools 注册三工具，而非独立 MCP server 或纯技能
      rationale: 与 opencode 插件 1:1 映射、DSH 原生 API 直接支持、工作量最小；符合 RFC「薄桥而非重写」结论
      alternatives_considered: ["技能-only（丢失确定性门禁价值）", "独立 MCP server（过度设计，需额外进程）"]
    - id: DD-002
      decision: fallback 采用「全局 xp-gate → 优雅降级提示」，不做 vendored CLI 随包
      rationale: vendored CLI 过重、与 src/npm-package「零运行时依赖」冲突、且 pluginDir 解析不可靠；优雅降级对齐项目「工具缺失→SKIP 非 BLOCK」约定
      alternatives_considered: ["随包打进 xp-gate CLI（过重+零依赖冲突，被 Delphi R1 否决）"]
    - id: DD-003
      decision: execute 内用 ctx.shell.run（注入 shell）并透传沙箱策略，不用 node:child_process 直连；buildCommand 纯函数做 shq() 转义
      rationale: 获得协作式取消、超时、沙箱策略复用 + 防命令注入
      alternatives_considered: ["node:child_process exec（无取消/超时/沙箱）", "双引号插值（注入风险，被 Delphi R1 否决）"]
    - id: DD-004
      decision: 12 个 skills 随发布包经平台原生 bundledSkillDir（$DSH_BUNDLED_SKILL_DIR）分发，不做 customSkillDirs/cp
      rationale: dsh plugin add 后技能即可被 skill 工具自动发现，AC 不依赖手工操作
      alternatives_considered: ["customSkillDirs/cp（靠用户手工，被 Delphi R1 否决）"]

