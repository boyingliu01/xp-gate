    # ============================================================
    # REQ-592: 门禁 fixture 必须同步实现的演进。
    # gate9-architecture.bats 在 CI 上 18 个用例失败、本地也几乎全红，原因全部是
    # fixture 停留在旧实现的状态上，而不是 Gate 9 本身有问题：
    #   1. PATH 被写死成 "$TEST_DIR/bin:/usr/bin:/bin"（替换而非前置），
    #      而 git/node 都不在这两个目录里（Linux CI 的 node 在 /usr/local/bin，
    #      Windows Git Bash 的 git 在 /c/Program Files/Git/...），setup 直接
    #      以 "git: command not found" 死掉，18 个用例全部未真正断言任何东西。
    #   2. pre-commit 现在 source 10 个 lib/*.sh，fixture 只复制了 now-ms.sh，
    #      hook 报 "FATAL: cannot load .../lib/audit-sanitize.sh (missing)" 后退出。
    #   3. `git init` 落在 master/main 上，而 Gate 0 视其为受保护分支并直接 exit，
