    #   4. Go fixture 用 `touch` 造空 .go 文件，golangci-lint 报
    #      "expected 'package', found 'EOF'"，Gate 1 BLOCK 后 Gate 9 无输出。
    # 结论：一个 fixture 只要能 setup 失败，它守护的门禁就等于没有守护。
    # ============================================================
    - id: REQ-592
      description: "门禁 fixture 必须能真正执行到被测门禁，且不依赖机器的工具布局"
      priority: high
      acceptance_criteria:
        - id: AC-592-01
