---
specification:
  id: SPEC-SLIM-001
  name: Sprint-Flow Skill Slimming
  version: "1.0.0"
  source_document: docs/plans/2026-06-17-sprint-flow-skill-slimming-design.md
  delphi_status: APPROVED
  delphi_rounds: 4
  delphi_consensus: "3/3"

  requirements:
    # ============================================================
    # REQ-SLIM-001: Phase 0 — Pre-fix document integrity
    # ============================================================
    - id: REQ-SLIM-001
      description: Fix document integrity issues before slimming — create missing references/ files and fix broken indexes
      priority: MUST
      context: |
        SKILL.md line 1306 references @references/phase-minus-1-isolate.md which does NOT exist on disk.
        SKILL.md References section (lines 1305-1313) is missing entries:
          - phase-7-land.md
          - phase-8-cleanup.md
          - phase-minus-0-5-auto-estimate.md
          - phase-minus-1-isolate.md (referenced but file doesn't exist)
        AGENTS.md STRUCTURE tree (lines 21-34) is missing entries:
          - phase-7-land.md
          - phase-8-cleanup.md

      acceptance_criteria:
        - id: AC-SLIM-001-01
          given: references/phase-minus-1-isolate.md does not exist
          when: Phase 0 completes
          then: references/phase-minus-1-isolate.md is created containing Phase -1 instructions

        - id: AC-SLIM-001-02
          given: SKILL.md References section is missing entries
          when: Phase 0 completes
          then: References section includes phase-minus-1-isolate, phase-7-land, phase-8-cleanup, phase-minus-0-5-auto-estimate

        - id: AC-SLIM-001-03
          given: AGENTS.md STRUCTURE tree is missing entries
          when: Phase 0 completes
          then: STRUCTURE tree includes phase-7-land.md, phase-8-cleanup.md

    # ============================================================
    # REQ-SLIM-002: Phase 1 — Deduplication
    # ============================================================
    - id: REQ-SLIM-002
      description: Remove duplicate content from SKILL.md — 3x Anti-Patterns, 2x Security Notes, 2x Output Format, YAML/body overlap, 11 examples
      priority: MUST
      context: |
        Measured duplicates:
        - 3x Anti-Patterns at lines 1222, 1327, 1385 — keep 1 (line 1222, most comprehensive)
        - 2x Security Notes at lines 144, 1291 — keep 1 (line 144, shorter)
        - 2x Output Format at lines 1342, 1400 — keep 1 (line 1342, with phase_history)
        - YAML frontmatter (lines 1-52) overlaps body Triggers/Scope/Examples/Params
        - 11 usage examples → slim to 3

      acceptance_criteria:
        - id: AC-SLIM-002-01
          given: 3 Anti-Patterns sections exist
          when: Phase 1 completes
          then: Exactly 1 Anti-Patterns section remains
        - id: AC-SLIM-002-02
          given: 2 Security Notes sections exist
          when: Phase 1 completes
          then: Exactly 1 Security Notes section remains
        - id: AC-SLIM-002-03
          given: 2 Output Format sections exist
          when: Phase 1 completes
          then: Exactly 1 Output Format section remains
        - id: AC-SLIM-002-04
          given: Body Triggers/Scope/Examples duplicate YAML frontmatter
          when: Phase 1 completes
          then: Body sections removed; canonical info in frontmatter only
        - id: AC-SLIM-002-05
          given: 11 usage examples exist
          when: Phase 1 completes
          then: Exactly 3 examples remain (full-sprint, --stop-at, --resume-from)

    # ============================================================
    # REQ-SLIM-003: Phase 2 — Phase instructions → references/
    # ============================================================
    - id: REQ-SLIM-003
      description: Move Phase execution instructions from SKILL.md to references/ files, leaving 3-5 line summaries
      priority: MUST
      context: |
        Currently Phase -1 through Phase 8 instructions total ~22KB.
        Each phase reduced to 3-5 line summary with @see references/phase-N.md.
        New files: references/orchestration-rules.md, references/phase-summary-format.md.

      acceptance_criteria:
        - id: AC-SLIM-003-01
          given: Phase -1 instructions in SKILL.md lines 289-344
          when: Phase 2 completes
          then: Phase -1 is 3-5 line summary with @see references/phase-minus-1-isolate.md
        - id: AC-SLIM-003-02
          given: Each Phase section has @references/ annotations
          when: Phase 2 completes
          then: All @references/ target files exist on disk
        - id: AC-SLIM-003-03
          given: references/orchestration-rules.md does not exist
          when: Phase 2 completes
          then: references/orchestration-rules.md exists with Agent Dispatch + Transition Gate
        - id: AC-SLIM-003-04
          given: references/phase-summary-format.md does not exist
          when: Phase 2 completes
          then: references/phase-summary-format.md exists with Phase Summary schema

    # ============================================================
    # REQ-SLIM-004: Phase 3 — Inline bash → logic descriptions
    # ============================================================
    - id: REQ-SLIM-004
      description: Replace all >3 line bash code blocks with 4-field logic descriptions
      priority: MUST
      context: |
        ~12KB of inline bash scripts replaced with WHAT/HOW/CHECKS/ERRORS blocks (~3KB).
        Full command sequences move to references/orchestration-rules.md.

      acceptance_criteria:
        - id: AC-SLIM-004-01
          given: SKILL.md has ~12KB of inline bash scripts
          when: Phase 3 completes
          then: All >3 line bash blocks replaced with 4-field logic descriptions
        - id: AC-SLIM-004-02
          given: Bash scripts removed from SKILL.md
          when: Phase 3 completes
          then: Full command sequences exist in references/orchestration-rules.md
        - id: AC-SLIM-004-03
          given: A 4-field logic description exists
          when: Phase 3 completes
          then: Each replacement follows WHAT/HOW/CHECKS/ERRORS format

    # ============================================================
    # REQ-SLIM-005: Phase 4 — Validation and CI
    # ============================================================
    - id: REQ-SLIM-005
      description: Create validation scripts and verify slimming results
      priority: MUST
      context: |
        Create scripts/check-skill-size.sh for automated validation.
        Manual verification of each Phase summary vs references/ content.
        Integration tests for core scenarios.

      acceptance_criteria:
        - id: AC-SLIM-005-01
          given: scripts/check-skill-size.sh is created
          when: Phase 4 completes
          then: Script checks SKILL.md size (>30KB WARN, >35KB ERROR)
        - id: AC-SLIM-005-02
          given: SKILL.md has @references/ annotations
          when: Script runs
          then: All @references/ target files exist on disk
        - id: AC-SLIM-005-03
          given: 7 AGENTS.md mirrors exist
          when: Script runs
          then: All mirrors are byte-identical

    # ============================================================
    # REQ-SLIM-006: On-demand loading protocol
    # ============================================================
    - id: REQ-SLIM-006
      description: Implement on-demand loading protocol so Agent reads references/ files sequentially during phases
      priority: MUST
      context: |
        Protocol from design §3.3:
        1. SKILL.md loaded by runtime
        2. Agent reads Phase N summary (3-5 lines)
        3. Agent detects @see references/phase-N.md annotation
        4. Agent reads references/phase-N.md for detailed instructions
        5. Agent executes Phase
        6. Next Phase → repeat 2-5

      acceptance_criteria:
        - id: AC-SLIM-006-01
          given: SKILL.md loaded
          when: Agent reads a Phase summary
          then: Summary ends with @see references/phase-N.md annotation
        - id: AC-SLIM-006-02
          given: references/phase-N.md does not exist
          when: Agent attempts on-demand load
          then: Falls back to SKILL.md summary + generic defaults

  # ============================================================
  # Design Decisions
  # ============================================================
  design_decisions:
    - id: DD-SLIM-001
      description: Keep YAML frontmatter as canonical, remove body Triggers/Scope/Params/Examples
      rationale: Frontmatter already contains triggers, parameters, examples, scope. Body duplicates ~5KB.
      alternatives_considered:
        - "Keep both — redundant info inflating token count"
        - "Remove frontmatter — breaks skill loader"

    - id: DD-SLIM-002
      description: Keep 3 usage examples (full-sprint, --stop-at, --resume-from)
      rationale: 11 examples add ~2.5KB to every load. 3 covers 90% of use cases.
      alternatives_considered:
        - "Keep all 11 — useful but costly"
        - "Keep 5 — marginal benefit over 3"

    - id: DD-SLIM-003
      description: Keep most comprehensive Anti-Patterns table (line 1222, 10 rows)
      rationale: Line 1222 version has 10 rows vs 8 in others, covers more anti-patterns.
      alternatives_considered:
        - "Merge all 3 versions — creates 3rd version with 12 rows"

    - id: DD-SLIM-004
      description: Phase migration done in one batch per §4
      rationale: Batch avoids mixed inline/reference inconsistency. Per-phase batches (Option B in design) prolong instability.

    - id: DD-SLIM-005
      description: "\"@references/\" paths relative to SKILL_DIR, not absolute"
      rationale: SKILL_DIR varies by deployment (OpenCode, Claude Code, npm). Relative paths work everywhere.

  # ============================================================
  # Success Metrics
  # ============================================================
  success_metrics:
    skill_md_size:
      current_bytes: 76108
      target_bytes: 28000
      reduction_pct: 63
    initial_load_tokens:
      current: ~47428
      target: ~38000
      reduction_pct: 62
    duplication:
      current_kb: 12
      target_kb: 0
    inline_bash:
      current_kb: 12
      target_kb: 3
    references_files:
      current: 16
      target: 19
    verification_script:
      exists: false
      target: true

  # ============================================================
  # File Changes (by phase)
  # ============================================================
  file_changes:
    - phase: "0"
      changes:
        - "references/phase-minus-1-isolate.md (new)"
        - "SKILL.md (modified — fix References index)"
        - "AGENTS.md (modified — fix STRUCTURE tree)"
    - phase: "1"
      changes:
        - "SKILL.md (modified — deduplicate Anti-Patterns/Security/Output/body/examples)"
    - phase: "2"
      changes:
        - "SKILL.md (modified — Phase instructions slimmed to summaries)"
        - "references/orchestration-rules.md (new)"
        - "references/phase-summary-format.md (new)"
    - phase: "3"
      changes:
        - "SKILL.md (modified — bash → logic descriptions)"
        - "references/orchestration-rules.md (modified — add bash commands)"
    - phase: "4"
      changes:
        - "scripts/check-skill-size.sh (new)"

  # ============================================================
  # Configuration
  # ============================================================
  configuration:
    skill_dir: ~/.config/opencode/skills/sprint-flow/
    copy_script: scripts/copy-skills.sh
    check_script: scripts/check-skill-size.sh
    size_warn_kb: 30
    size_error_kb: 35
