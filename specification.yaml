          test_type: unit

    # ============================================================
    # REQ-602: hook 引擎的每个 shell 文件都必须能被 bash 解析。
    #
    # #579：pre-commit 的 Gate 5 逐文件覆盖率块混进了一个反引号。
    # bash 把它当成命令替换的开始，于是文件剩余部分整体解析失败：
    #     pre-commit: line 3208: syntax error near unexpected token `('
    # hook 在打印完「✅ PASSED - Gate 5」后直接死掉，Gate 6/7/8/9/10/11/12
    # 与最终质量报告从未执行，退出码取自最后一条成功的命令，于是提交被放行，
    # 且输出里没有任何迹象说明七道门禁没跑。
    #
    # 现有防线都没拦住它：
    #   - BATS 套件执行的是单道门禁，没有任何一条解析整个 hook 文件；
    #   - scripts/verify-xp-gate-patches.cjs 只核对 mutation runner 的三处与
    #     pre-push 的 --timeout，hook 可解析性不在范围内；
    #   - scripts/check-hook-mirror.sh 比字节，字节相同的坏文件照样通过。
    #
    # 不变量因此是：引擎会执行的每个 shell 文件都必须能解析。它便宜（bash -n，
    # 不执行）、与平台无关，并且在缺陷仍然无害的那一刻就大声失败。
    # ============================================================
    - id: REQ-602
      description: "hook 引擎执行的每个 shell 文件都必须能被 bash -n 解析，含 npm 分发的副本"
      priority: critical
      acceptance_criteria:
        - id: AC-602-01
          criteria: githooks/ 下 pre-commit、pre-push、adapter-common.sh、
            hook-module-resolution.sh、sprint-gate.sh、install.sh、lib/*.sh、
            adapters/*.sh 必须全部通过 bash -n；任一失败必须红，且必须点出文件名与
            真实报错；遍历结果不得为空（否则守卫是空转）
          test_type: unit
        - id: AC-602-02
          criteria: src/npm-package/hooks/ 下会随包发布的副本也必须通过 bash -n，
            不得出现仓库内可解析而分发副本不可解析的不一致
          test_type: unit

    # ============================================================
    # REQ-603: Gate 8「exit 0 但没有报告」必须区分「工具没跑成」与「跑了但没写文件」。
    #
    # #592 报告 gitleaks 8.30.1 在干净扫描时不创建 --report-path 文件，于是
    # 每次干净提交都打印
    #     ⚠️  gitleaks exited 0 but produced no readable report
    #     ⏭️  SKIPPED - secret scanning produced no evidence (not a pass)
    # 一次正常通过的密钥扫描被永久记成 SKIP。
    #
    # 本机（git-bash，同为 8.30.1）实测干净扫描**会**写出 []，
    # issue-493-gate8-clean-report-count.test.bats 的 AC-493-03 用真实二进制
    # 钉住了这一点，因此该症状在本仓库不可复现。本需求不去"修"一个观察不到的
    # 缺陷，而是钉住另一件在所有平台都成立、且此前缺失的事：该分支只有一种回应，
    # 而它把两个完全不同的事实写成了同一句话——
    #   (a) 扫描根本没跑成（配置读不到、FTL、--report-path 非法）：什么都没检查，
    #       必须 fail-closed 并复述工具自己的话；
    #   (b) 扫描跑了、没有发现、但工具没写文件：只剩 stdout，而 stdout 是比工件
    #       更弱的证据，仍不得判 PASS，但必须说明"是扫描干净而不是没扫"。
    # 顺序即要点：工件优先、工具故障次之、工具输出最后（#449 立的原则，
    # #592 从另一面重新打开它）。
    # ============================================================
    - id: REQ-603
      description: "Gate 8 在 exit 0 且无报告时必须区分工具故障与「扫描干净但无工件」，后者不得判 PASS 但必须说明原因"
      priority: high
      acceptance_criteria:
        - id: AC-603-01
          criteria: 存在干净的 [] 报告工件时仍必须判 PASS——工件是最强证据，放宽无工件路径不得削弱它
          test_type: unit
        - id: AC-603-02
          criteria: gitleaks exit 0 但输出含 FTL / unable to load 等工具故障时必须
            fail-closed 并报 ENVIRONMENT（退出码非 0），复述工具报错，且不得声称扫描干净；
            不得归入「无证据」
          test_type: unit
        - id: AC-603-03
          criteria: exit 0 且既无报告工件也无工具故障时不得判 PASS；若 stdout 表明扫描确实
            执行过（no leaks found），SKIP 文案必须说明「扫过但无工件」而非「无证据」；
            工件含 findings 时必须仍然拦阻
          test_type: unit

    # ============================================================
    # REQ-604: 覆盖已安装 hook 的部署必须留下「被覆盖了什么、被哪个版本」的记录。
    #
    # #583：`xp-gate doctor --sync-hooks` 在 24 小时内静默覆盖了
    # ~/.config/xp-gate/hooks/pre-commit 三次。下游把硬化补丁同时写进 vendored 副本
    # 与 live 副本、并用一致性测试守着，仍只能靠自己的 SHA256 比对发现。后果不小：
    # 其中一次把已修好、已测试的 Gate 5 覆盖率 fail-open 回退了，提交又开始在
    # 「无法测量」时放行。
    #
    # #566 加了备份，让被破坏的文件可恢复；但它回答不了下游真正的问题：
    # 「我的补丁是不是被吃了，被哪个版本吃的？」一堆带时间戳的 .bak 只有
    # 已经怀疑被覆盖的人才读得懂。
    #
    # 因此本需求只钉一件无需网络、无需真实安装即可验证的事：sync-hooks 覆盖文件 X 时，
    # 在部署日志里追加一行，写明 X、执行覆盖的版本、以及保存旧内容的备份。
    # 只追加不重写——「今天三次」正是这个日志存在的理由。
    #
    # 刻意不在范围内（issue 的第 2 项建议）：本地被改过的 hook 默认拒绝覆盖、
    # 需 --force 才覆盖。那会改变所有消费者的部署契约，是需要产品决策的变更，
    # 不是缺陷修复。
    # ============================================================
    - id: REQ-604
      description: "doctor --sync-hooks 每次覆盖已安装 hook 都必须在部署日志里追加一条记录，含文件名、版本与备份"
      priority: high
      acceptance_criteria:
        - id: AC-604-01
          criteria: 覆盖一个内容不同的已安装 hook 后，必须在已安装 hook 目录旁追加一行部署记录，
            该行须同时点出文件名、执行覆盖的版本号与保存旧内容的备份文件名
          test_type: unit
        - id: AC-604-02
          criteria: 内容完全一致（被跳过、未覆盖）的文件不得产生部署记录——记录非事件的日志是噪声，
            而噪声正是让真实覆盖不可见的原因
          test_type: unit
        - id: AC-604-03
          criteria: 多次覆盖必须逐条累积，不得重写历史；两次覆盖后该文件的记录必须恰为两条
          test_type: unit


    # ============================================================
    # REQ-605: Gate 5c（spec/test 语义对齐）不得以「什么都不打印」表示「没检查」，
    #          且测试文件发现必须覆盖各语言约定。
    #
    # #585：整个检查体包在
    #     if [ -f "$REQ_IDS_FILE" ] && command -v jq >/dev/null 2>&1; then
    # 里面。req-ids.json 由 `xp-gate check-alignment` 生成到 .sprint-state/，
    # 而这个目录被 gitignore、在新克隆上永远不存在——因此在这份「正常状态」下，
    # Gate 5c 输出零字节：不是 PASS，不是 FAIL，也不是 SKIP，
    # generate_quality_report() 里也没有它的位置。一个项目的语义对齐从未被检查过
    # 一次，而所有报告都是绿的。这与 #449/#499/#570/#575/#594 是同一缺陷类：
    # 把沉默读成成功。
    #
    # 第二个缺陷：即使检查跑起来，文件发现只认 JS/TS
    #     grep -E '\.(test|spec)\.(ts|tsx|js|jsx|cjs|mjs)$'
    # Pester 的 *.Tests.ps1、pytest 的 test_*.py、Go 的 *_test.go、Java 的
    # *Test.java、Kotlin 的 *Tests.kt 一个都匹配不上，于是这些语言的仓库上
    # 这道门报「0 个注解、0 个未覆盖」——一个空转的绿。
    #
    # GATE_5C_STATUS 现在恒为 PASS / SKIP / BLOCK 之一，不再是空串。
    # ============================================================
    - id: REQ-605
      description: "Gate 5c 必须显式区分「对齐通过」「未检查（SKIP）」「阻断（BLOCK）」，并按各语言测试文件约定发现测试"
      priority: high
      acceptance_criteria:
        - id: AC-605-01
          criteria: req-ids.json 缺席时 Gate 5c 必须打印明示的未检查状态并给出可执行的修复命令，
            不得输出零字节；该状态须区别于 PASS
          test_type: integration
        - id: AC-605-02
          criteria: 测试文件发现必须覆盖 Pester（*.Tests.ps1）、pytest（test_*.py、*_test.py）、
            Go（*_test.go）、Java（*Test.java）、Kotlin（*Tests.kt）与原有 JS/TS 约定；
            同时普通源文件不得被误判为测试文件
          test_type: integration
        - id: AC-605-03
          criteria: 扩宽发现范围后，指向不存在 REQ 的 @test 注解仍必须阻断提交，合法注解必须放行
          test_type: integration
        - id: AC-605-04
          criteria: 本次改动不含测试文件时，Gate 5c 必须显式说明「无可对齐的测试」，
            而不是保持沉默——沉默让运维无法区分「无事可做」与「门禁坏了」
          test_type: integration


    # ============================================================
    # REQ-606: Gate 2（重复代码）必须对「什么不该被扫描」给出默认答案，并让这个
    #          默认基线可被审计。
    #
    # #591：`resolve_jscpd_config` 在项目没有 jscpd.conf.json 时返回空，
    # pre-commit 于是用 jscpd 自身的默认值跑——而 jscpd 默认把 .yaml/.txt/.log
    # 都当作可扫描格式。结果是豁免清单（exemptions.yaml）、金标准快照
    # （rule-behavior-golden.txt）和构建日志（*.log）都被拿去查「重复代码」。
    # 本仓库实测：一份 13 行 exemptions.yaml 的两份拷贝 + 两份 build-run.log，
    # 报出「Found 1 exact clones with 38 (48.72%) duplicated lines in 2 files」，
    # 其中没有一行是「应该重构的重复」——重复正是豁免清单的数据形态，日志则是
    # 本来就要留档的产物。
    #
    # 这个数字比噪声更糟：读者无法区分「必须重复的 yaml 数据」与「真被复制粘贴的
    # 两段 Java」，于是诚实的反应是整体不再阅读 Gate 2，连带放过真重复。
    # 报告人自己的统计：176 个 clone，真正可重构的 6 个。
    #
    # 本需求只钉 issue 的建议 1 与 3（默认忽略集 + 打印实际生效的基线）。
    # 建议 2（按「生产源码/测试源码/数据文档」分组报告）是新增特性，不在范围内。
    # ============================================================
    - id: REQ-606
      description: "Gate 2 在项目未提供 jscpd.conf.json 时必须使用一份窄化的默认忽略集，并打印该基线使其可审计"
      priority: high
      acceptance_criteria:
        - id: AC-606-01
          criteria: 无项目配置时，数据与证据类文件（*.log、*.txt、*.yaml/*.yml、*golden*、
            *baseline.json、*evidence*）与构建产物目录（node_modules、dist、build、target、
            coverage、out、vendor）必须被默认排除；但真实源码扩展名（.ts/.java/.py/.go 等）
            必须仍被扫描——扩大忽略集不得成为掩盖债务的手段
          test_type: integration
        - id: AC-606-02
          criteria: 项目自带的 jscpd.conf.json 必须优先于默认忽略集；同时须提供
            XP_GATE_JSCPD_DEFAULT_IGNORE=0 关闭默认忽略集的逃生舱，否则该默认值会让
            某些真实重复不可达
          test_type: integration
        - id: AC-606-03
          criteria: 默认忽略集必须以人类可读形式可打印，使「到底扫描了什么」无需阅读正则即可核对
          test_type: integration


    # ============================================================
    # REQ-607: Windows 上 hook 必须能看到「已安装」的工具链，且工具链故障不得
    #          被报成代码缺陷。
    #
    # #593：hook 在 git-bash 下运行，而 git-bash 看不到调用方在 Windows 侧加的
    # PATH，且本仓库门禁依赖的工具链标准安装位置都不在 git-bash 的默认 PATH 上：
    #   npm 全局 CLI        %APPDATA%\npm
    #   node 解释器         C:\Program Files\nodejs
    #   pip --user 脚本      %APPDATA%\Python\PythonNNN\Scripts
    #   手工放置的工具       ~/bin、~/.local/bin
    # 每个门禁只用 command -v / npx --no-install / ~/.local/bin 探测，于是
    # 「不在这条 shell 的 PATH 上」被报成「没装」。四个门禁对已安装的工具都这样报，
    # 其中两个是假绿：一个从未运行的门禁被报成「可选工具缺失」的 WARN。
    #
    # 最严重的是 exit 127：npm 的 POSIX shim 被解析到后死于
    # `exec: node: not found`，Gate 6 于是打印「❌ BLOCKED - Architecture
    # violations detected」——把坏掉的工具链报成代码缺陷，把读者指向本来没问题的代码。
    #
    # 修法落在共享层而不是各门禁里：一个 PATH bootstrap，追加而非前置，所以调用方的
    # PATH 顺序仍是权威；加上 command -v 看不见的形态的专用探测。
    # ============================================================
    - id: REQ-607
      description: "hook 启动时须引导工具链 PATH，并支持子项目 node_modules、Python Scripts 通配与包装器同目录解析，同时区分工具链故障与真实缺陷"
      priority: high
      acceptance_criteria:
        - id: AC-607-01
          criteria: 引导函数必须把标准工具链位置追加到 PATH 末尾（不得前置，调用方顺序优先），
            须通配 Python Scripts 目录而非猜测版本，且重复调用必须幂等
          test_type: integration
        - id: AC-607-02
          criteria: 必须能解析 command -v 看不见的形态：子项目 node_modules/.bin 中的工具；
            解析包装器时必须把其自身目录放入调用方 shell 的 PATH（否则包装器 exec 兄弟二进制会失败）
          test_type: integration
        - id: AC-607-03
          criteria: 工具无法解析时必须列出所有搜索过的位置，使「没装」与「装了但找不到」可区分
          test_type: integration
        - id: AC-607-04
          criteria: 工具自身 shim 的 exit 127 / exec not found 必须分类为工具链故障，
            而真实违规（非工具链故障）必须仍分类为 FINDING——不得把一切归为工具链问题，
            否则门禁再也无法就真实违规阻断
          test_type: integration


    # ============================================================
    # REQ-608: `xp-gate check . --all` 必须是「全量检查」——依赖 CHANGED_FILES
    #          的门禁在 --all 下必须扫描整个工作树，而不是本次 diff。
    #
    # #589：文档说 --all 是全量检查，但 Gate 3 仍从 `git diff` 取文件清单，于是
    # 工作树干净时（提交之后的常态，也是 CI 跑 --all 的状态）它收到空清单并打印
    #
    #     ⏭️  SKIPPED - Complexity (no source files to check)
    #
    # `--all` 因此比一次普通提交检查得更少，却读起来像通过。Gate 4 不依赖
    # CHANGED_FILES，在同一份 preamble 下工作正常——这正证明了缺陷出在「文件来源」。
    #
    # 并且文案把「diff 为空」说成了「项目没有源文件」，而它的自然读法是「这道门
    # 通过了」；报告人因此改为手工跑 lizard 绕过。空清单必须点名真实原因。
    #
    # 若某门禁确实只能按 diff 工作，它必须显式标为 SKIP 并写清理由，且 SKIP 须
    # 参与 verdict（#575），不得静默计入通过。
    # ============================================================
    - id: REQ-608
      description: "check --all 须以仓库全部被跟踪源文件作为待检集合，并区分「diff 为空」与「树里没有源文件」"
      priority: high
      acceptance_criteria:
        - id: AC-608-01
          criteria: --all 下 CHANGED_FILES 必须解析为仓库内全部被跟踪的源文件；数据与文档类文件
            （.md/.csv/.txt）不得被当作源文件；须覆盖 .ts/.tsx/.js/.py/.go/.java/.kt/.rs/.sh 等扩展名
          test_type: unit
        - id: AC-608-02
          criteria: 空清单的说明必须点明真实原因——diff 作用域下须说明「本次无改动文件」并指向 --all，
            且不得声称项目没有源文件；--all 作用域下须说明「仓库内无被跟踪源文件」
          test_type: unit
        - id: AC-608-03
          criteria: 实际使用的扫描作用域必须可被报告；且 checkAllGates 必须把 all 作用域
            真正传递给每个可调用门禁——解析器全对而调用链没接线是同一个缺陷
          test_type: unit


    # ============================================================
    # REQ-609: 工具探测必须认得 Windows 的 .exe 后缀，且环境故障不得被报成代码判定。
    #
    # #580：`command -v node` 在 WSL 和 git-bash 下返回 1，即使
    # /mnt/c/Program Files/nodejs/node.exe 就在那里且能运行——bash 不会像 Windows
    # 那样补后缀。这一个事实在同一台机器上给出三种不同的错误结论：
    #   Gate 1  "SKIP - npx not available"           fail-OPEN，读起来像「无可检查」
    #   Gate 1  "BLOCKED - Biome check failed"       fail-CLOSED，但归因错误
    #   Gate 8  "BLOCKED - gitleaks not installed"   安全门禁被自己的环境拦住
    # 三条都在把环境问题描述成代码问题。
    #
    # 这是 #593 未覆盖的另一半：#593 已把 Windows 侧工具链目录引导进 PATH，但那是
    # 必要不充分的——引导之后 `command -v node` 仍是 1，因为文件名是 node.exe。
    #
    # 诚实标注的限制：在 git-bash 上无法用行为断言隔离 .exe 分支（该宿主 PATHEXT
    # 过于宽松，连带点的基名都被解析）。因此该分支以结构断言锁定，并在测试里写明
    # 这是「此处最强为真的陈述」，而不是假装有行为覆盖。
    # ============================================================
    - id: REQ-609
      description: "工具探测须支持 .exe 后缀与环境变量覆盖，使 WSL/git-bash 上已装工具不被报成缺失"
      priority: high
      acceptance_criteria:
        - id: AC-609-01
          criteria: tool_is_available 必须认得只有 *.exe 形态的可执行文件；真正缺席的工具仍须判为缺席
            （不得为了修「找不到」而让探测对所有名字回答是）；XP_GATE_<TOOL>_BIN 覆盖必须优先于一切探测
          test_type: integration
        - id: AC-609-02
          criteria: resolve_tool_path 返回的路径必须真的可执行——「找到文件」与「能运行它」不是同一件事
          test_type: integration
        - id: AC-609-03
          criteria: 工具缺失/命令不存在必须分类为工具链故障，且提示中须点明这是 PATH 问题而非代码问题
          test_type: integration


    # ============================================================
    # REQ-610: 适配器加载共享库时必须覆盖所有发行布局，且加载失败不得静默。
    #
    # #597：三个适配器用
    #     source "$SCRIPT_DIR/../adapter-common.sh" 2>/dev/null || true
    # `$SCRIPT_DIR` 已经是 `.../adapters`，于是 `../adapter-common.sh` 是
    # `.../adapter-common.sh`。仓库布局下这个文件恰好存在（npm 包在那里留了一份
    # 副本），但全局安装布局 `~/.config/xp-gate/adapters/` 下不存在：
    #     test -f ~/.config/xp-gate/adapter-common.sh           -> 不存在
    #     test -f ~/.config/xp-gate/adapters/adapter-common.sh  -> 存在
    # 即在该门禁实际运行于大多数消费方机器的那种布局里，共享库从未加载，它提供的
    # 每个函数都是未定义的。
    #
    # `2>/dev/null || true` 是让它不可见的原因：加载失败与加载成功无法区分，适配器
    # 于是退化成各自碰巧有的兜底，或在稍后以无关的 "command not found" 失败。
    # 用正确路径的适配器：0 个。这不是一个笔误，是一整类。
    # ============================================================
    - id: REQ-610
      description: "适配器须按候选列表加载 adapter-common.sh，覆盖全局安装与 npm 包两种布局"
      priority: high
      acceptance_criteria:
        - id: AC-610-01
          criteria: 不得再有适配器通过不存在的父级路径加载 adapter-common.sh
          test_type: integration
        - id: AC-610-02
          criteria: 全局安装布局（库在 adapters/ 内）与 npm 包布局（库在 adapters/ 上一级）
            都必须真正加载成功——以库定义的函数可见为判据，而非「source 没报错」
          test_type: integration
        - id: AC-610-03
          criteria: 原先受影响的 go.sh / iac.sh / python.sh 三个适配器须全部修复且语法有效
          test_type: integration


    # ============================================================
    # REQ-611: 「工具存在」不等于「工具能运行」，且 ORIGINAL_PATH 才是可靠来源。
    #
    # #596：`command -v checkov` 在 POSIX shim 上成功——shim 内容为
    #     #!/bin/sh
    #     exec python ".../Scripts/checkov" "$@"
    # 而该 shell 里 `python` 不可解析，于是 `command -v` 看到「有工具」，执行时在
    # `exec` 处以 127 死掉。检测层与执行层判据不一致。
    #
    # 后果对一道安全门禁是最坏的一种：Gate 7 数出「可用扫描器 = 0」并无条件 BLOCK，
    # 而机器上 checkov 3.3.30 既能装也能用。文案写的是「没有可用的扫描工具」——
    # 一个环境故障穿上了代码判定的外衣。这是同一类的第三次（#536、#593）。
    #
    # 另一点：hook shell 里 $PATH 可能只剩 7 条，而 ORIGINAL_PATH 仍携带完整
    # Windows PATH（3002 字符），自定义前缀（D:\npm）只出现在后者里。任何「猜标准
    # 安装目录」的探测（#593 的 bootstrap 正是如此）都找不到自定义前缀。
    # ============================================================
    - id: REQ-611
      description: "工具可用性须以可执行性验证，并支持 ORIGINAL_PATH 来源；环境故障不得产出代码判定"
      priority: high
      acceptance_criteria:
        - id: AC-611-01
          criteria: 存在但无法执行的 shim（解释器缺失，退出 127）不得被报为可用；能正常运行的工具仍须报为可用；
            且「存在但跑不起来」须与「未安装」区分为不同状态
          test_type: integration
