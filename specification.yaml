    # ============================================================
    # REQ-570: findBash 必须拒绝 WSL 的 bash，优先选 Git for Windows。
    # findBash 把裸名 "bash" 排在候选首位，只要 `bash --version` 退出 0 就接受。
    # 装了 WSL 的机器上，PATH 里的 bash 就是 WSL：
    #   (Get-Command bash -All).Source -> C:\WINDOWS\system32\bash.exe
    #   bash -c "uname -s"             -> Linux
    #   bash --version                 -> 退出 0   <- 正好是探针的接受条件
    # 于是 findBash 返回 "bash"（WSL），后续 `bash -n <windows 路径>` 一律报
    # "No such file or directory"——Linux 的 bash 打不开 C:/...。doctor 报健康
    # hook 不可解析，源头在这里。
    #
    # 这条同时是对 issue #563 的自我更正：我在那里断言 §2.2 的 WSL 桩问题
    # "不复现"并降级为健壮性债。当时测的是 `where bash` 与 `bash --version`
    # 的 UTF-16 垃圾输出，但 Node 的 spawnSync('bash',...) 走 PATH 解析到的是
    # 另一个（健康的）WSL bash，退出码 0。结论本来就是对的，撤销是错的。
    # ============================================================
    - id: REQ-570
      description: "Windows 上 findBash 必须返回能打开 Windows 路径的 Git bash，WSL 的 bash 不得被选中"
      priority: critical
      acceptance_criteria:
        - id: AC-570-01
          criteria: findBash 返回的 bash 的 `uname -s` 必须报 MINGW/MSYS/CYGWIN，
            不得是 Linux（WSL）
          test_type: unit
        - id: AC-570-02
          criteria: 本机存在 Git for Windows 的 bash 时，findBash 必须选中它，
            不得因 PATH 里 WSL 的 bash 先可用而返回别的
          test_type: unit
        - id: AC-570-03
          criteria: findBash 选中的 bash 必须能实际打开一个 Windows 临时目录下的
            hook 文件（`bash -n` 成功）；这是 doctor 探针能工作的前提
          test_type: unit

    # ============================================================
    # REQ-571: PowerShell 静态分析支持仓库本地作用域，且作用域失效必须 fail-closed。
    # 未合并分支 fix/powershell-gates-fail-closed 里唯一 main 缺失的功能：仓库可用
    # .xp-gate-powershell-analysis-paths 声明"产品作用域"。理由：Pester 测试文件
    # 按 Pester 执行模型会合理触发大量规则告警，全仓扫描要么挡住每次 PowerShell
    # 提交，要么逼着把规则集打开——两条路都等于不再门禁 PowerShell。
    #
    # 真正承重的是"作用域失效"：文件里列了但磁盘上不存在的路径，意味着产品代码
    # 逃出了门禁（改名/搬走/新增脚本却没更新作用域）。那必须 fail-closed 地发出
    # 原因，让 pre-commit 映射成计入分母的 WARN，而不是少分析一点还报 PASS。
    # 声明为空（只有注释/空行）同理：静默分析零个路径会 exit 0 读成干净通过。
    # 没有作用域文件时保留原有全仓行为，存量仓库不受影响。
    # ============================================================
    - id: REQ-571
      description: "PowerShell 适配器支持仓库本地分析作用域；作用域条目缺失或声明为空必须 fail-closed"
      priority: high
      acceptance_criteria:
        - id: AC-571-01
          criteria: 作用域文件里列出但磁盘上不存在的路径，必须发出 XP_G1_REASON analysis-path-missing 原因；存在的路径照常分析
          test_type: unit
        - id: AC-571-02
          criteria: 作用域文件存在但只含注释与空行（含纯空白行）时必须发出 analysis-paths-empty 原因，不得静默分析零个路径后 exit 0
          test_type: unit
        - id: AC-571-03
          criteria: 没有作用域文件时必须仍走全仓分析（引擎确实被调用），且不得发出任何作用域相关的原因
          test_type: unit
        - id: AC-571-04
          criteria: 引擎存在但运行失败时必须发出 XP_G1_REASON（断言协议本身，不断言具体文案），确保作用域改造没有让失败退化成静默通过
          test_type: unit

    # ============================================================
    # REQ-572: Gate 10 必须能找到 Windows pip --user 安装的 semgrep。
    # gate-10.sh 只用 `command -v semgrep` 加一个 Unix 专用回退
    # ($HOME/.local/bin/semgrep)。Windows 上 `pip install --user semgrep` 落在
    # %APPDATA%\Python\<ver>\Scripts\semgrep.exe，git-bash 不继承该 PATH 项，
    # 于是装好且可用的 semgrep 被判为"未安装"，Gate 10 降级为 WARN——而这正是
    # 本项目的开发平台。Gate 10 是 SAST 门禁：WARN 虽好过假 PASS，但永不阻断，
    # 所以"找不到工具"就是 #499 那个洞的轻一档版本。该探测只存在于未合并分支
    # fix/powershell-gates-fail-closed。
    # ============================================================
    - id: REQ-572
      description: "Gate 10 检测 semgrep 时必须覆盖 Windows pip --user 的 APPDATA 安装路径，且以可执行为准"
      priority: high
      acceptance_criteria:
        - id: AC-572-01
          criteria: 仅当 APPDATA/Roaming/Python/<ver>/Scripts/semgrep.exe 存在且可执行时，必须被检测为 semgrep 命令
          test_type: unit
        - id: AC-572-02
          criteria: 该路径存在但执行返回非零时不得被采纳为可用 semgrep（探测按退出码，不按是否存在）
          test_type: unit
        - id: AC-572-03
          criteria: 任何位置都没有 semgrep 时检测结果保持为空，Gate 10 仍降级为 WARN 而非 PASS
          test_type: unit

