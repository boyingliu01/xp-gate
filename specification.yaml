          test_type: unit
        - id: AC-563-02
          criteria: 同步返回 0 的 handler 仍判定为通过——防止「一律返回失败」式的伪修复
          test_type: unit
        - id: AC-563-03
          criteria: 返回 Promise 的 handler、同步抛异常的 handler、以及 Promise reject 的
