        - id: AC-599-04
          criteria: 覆盖率门禁判定不出覆盖率时（无报告文件或报告不可解析）必须拦阻而非放行；唯一例外是 PARTIAL_TEST_RUN 子集运行，此时只警告
          test_type: unit
        - id: AC-599-05
          criteria: 覆盖率门禁的通过/拦阻信息必须引用实际生效的阈值（含未设置时的历史默认 80），不得硬编码 80；实测 0% 属于测量结果，必须参与阈值比较而非并入"未测出"
