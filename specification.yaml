    # 后者以 `npm error Missing script: "test:cover"` 死掉，并**覆盖**了日志里的真实
    # 错误。Gate 5 报的是「脚本缺失」而不是「哪个用例失败」，把排查引到了错误方向
    # 好几轮。吞掉主错误的回退链比没有回退更糟。
    # 被它盖住的真实失败是：
    #     FAIL .../doctor.test.js > --fix: diagnoses TUI not registered ...
    #     Error: Test timed out in 5000ms.
    # 该用例单独跑约 3.8s（占 vitest 默认 5s 预算的 76%），全量 200 个文件共享机器时
    # 就超过 5s。它做的是完整的 doctor --fix 流水线，工作量是真实的，只是预算太小。
    # ============================================================
    - id: REQ-588
