    # ============================================================
    # REQ-613: Gate 4 在 Windows 上的命令行不得触及 cmd.exe 的 8191 字符上限。
    #
    # #586：`xp-gate check . --all` 下 Gate 4 在 Windows 上一律报
    #     Failed to run principles check: The command line is too long.
    # 两个原因叠加在 lib/principles.js 的同一次 spawnSync 里：
    #   1. `shell: process.platform === 'win32'` 走 cmd.exe，其命令行上限 8191 字符
    #      （CreateProcess 是 32767）；
    #   2. 全部路径被 join 进同一个 argv 元素（`files.join(' ')`）。135 个 .java 实测
    #      12944 字符，加上 npx 前缀后必然越线。
    # 这不是「偶尔的超大项目」，是中等规模项目在 Windows 上的必然结果。
    #
    # 把 join 拆成多个 argv 元素无效（瓶颈是总字符数而非引号），且 npx 在 Windows
    # 上仍需 shell:true 才能被找到 —— 所以正确方向是绕开 npx 与 cmd：用项目自带的
    # tsx 经 process.execPath（node.exe 绝对路径，无 shim、无 shell）执行，超长清单
    # 改为按引用（@文件）传递。
    #
    # 另一半是失败该叫什么。「Failed to run principles check」读起来像原则违规，但
    # 什么都没被分析——那是环境故障。#596 在 shell 工具链里修了同一处混淆。
    # ============================================================
    - id: REQ-613
      description: "Gate 4 调用须避开 cmd.exe 命令行上限，并将启动失败与真实违规区分开"
      priority: high
      acceptance_criteria:
        - id: AC-613-01
          criteria: 中等规模项目（135 个文件的实测字符量）的命令行须低于 8191 字符；超长清单须按引用传递
            而非按值；能装下的清单仍直接传递
          test_type: unit
        - id: AC-613-02
          criteria: 调用不得启用 shell，且可执行程序不得是裸 npx；调用点须真正使用调用计划
          test_type: unit
        - id: AC-613-03
          criteria: 命令行过长等启动失败须归类为 TOOLCHAIN 而非 FINDING；真实违规仍须归为 FINDING
          test_type: unit


    # ============================================================
    # REQ-614: Gate 8 不得把「扫描器起不来」报告成「发现密钥」。
    #
    # #582：WSL 上 Gate 8 对一个不含任何密钥的仓库报「Secrets detected in staged
    # files」，并让用户去轮换密钥。实际上什么都没扫描。两个独立缺陷：
    #
    # 1. WSL 没有 `cygpath`（那是 Git-for-Windows/MSYS 的工具，对应物是 `wslpath`），
    #    于是 gate-8.sh 走 fallback，把 POSIX 路径 `/mnt/d/.../.gitleaks.toml` 交给
    #    原生 gitleaks.exe，它打不开：
    #        FTL unable to load gitleaks config, err: open /mnt/d/...:
    #          The system cannot find the path specified.
    # 2. gitleaks 以退出码 1 结束，而 gate-8 的 `elif [ "$GITLEAKS_EXIT" -eq 1 ]`
    #    分支词条就是「Secrets found」。
    #
    # 退出码 1 既表示 findings 也表示 config/IO 错误。#592 已为「exit 0 + FTL」建立
    # 了这条区分；这里是同一区分在 exit 1 上的缺失，而它的错误答案最响：一道 fail-closed
    # 的安全门禁，对一份它从未读过的仓库给出了最高危的结论。能且只能说「你泄漏了密钥」
    # 的门禁，会把人训练成关掉它。#596 在 shell 工具链里修了同一类混淆。
    # ============================================================
    - id: REQ-614
      description: "Gate 8 须在 WSL 上正确转换配置路径，并区分扫描器启动失败与真实密钥发现"
      priority: critical
      acceptance_criteria:
        - id: AC-614-01
          criteria: gitleaks 退出码 1 且带 FTL/配置加载失败特征时须报为 ENVIRONMENT 而非「发现密钥」，
            且不得给出轮换密钥的建议；真实泄漏仍须报为发现密钥
          test_type: integration
        - id: AC-614-02
          criteria: 除 cygpath 外须支持 wslpath 转换，且转换须先于未转换的兜底路径尝试
          test_type: integration
        - id: AC-614-03
          criteria: gate-8.sh 改动后语法有效
          test_type: integration


    # ============================================================
    # REQ-615: 交给原生二进制的绝对路径必须先转换成宿主格式。
    #
    # #581：WSL 上两道门禁把「工具自身的路径问题」报成「用户仓库的缺陷」：
    #   Gate 9  ❌ BLOCKED - Build integrity check failed
    #           Fix type errors, broken imports, or package manifest issues
    #   Gate 8  ❌ BLOCKED - Secrets detected in staged files
    # 两者的原因都是 POSIX 绝对路径被交给原生 Windows 二进制。node.exe 把开头的 `/`
    # 解析成 `<当前盘符>:\`，于是 `/c/Users/x/.config/xp-gate/modules/build-integrity/gate-10.ts`
    # 变成 `D:\c\Users\...`，模块「找不到」。
    #
    # 关键区分（issue 原文）：相对路径一直是好的——node 用自己的 cwd 正确翻译了它。
    # 所以缺陷不是「WSL 不支持」，而是「绝对路径没有翻译」。
    #
    # 这是 #582、#596 同一类的第四次。正因如此，修复落在一个共享库上而不是又一处
    # 内联分支：同一份转换知识此前被 gate-8 内联重写了一次，而 Gate 9 从来没有。
    # ============================================================
    - id: REQ-615
      description: "POSIX 绝对路径交给原生二进制前须转换；相对路径不动；转换能力须按宿主判定"
      priority: high
      acceptance_criteria:
        - id: AC-615-01
          criteria: 绝对 POSIX 路径须转换为原生形式；相对路径与空路径须原样返回；无转换器时不得丢失路径
          test_type: integration
        - id: AC-615-02
          criteria: 是否需要转换须由宿主（WSL / MSYS / 转换器存在）明确判定
          test_type: integration
        - id: AC-615-03
          criteria: pre-commit 须加载转换库并实际转换 Gate 9 的模块路径与项目根，
            使其不再以 POSIX 绝对形式交给 node
          test_type: integration


    # ============================================================
    # REQ-616: 未覆盖项目的扫描不得报满分。
    #
    # #590：Java 项目上 Gate 6 恒定满分：
    #     architecture_grade: { density: "0.00", level: "Excellent", score: "10.0" }
    #     files_analyzed: 1
    # 而该项目有 140 个 .java 文件。archlint 的检测器基于 JS/TS 扩展名的导入图，
    # .java 不在其中，于是它只分析了 1 个文件（很可能是根目录 pom.xml），没在其中
    # 发现 smell，评分逻辑就把「没有 smell」直接映射成「10.0 / Excellent」。
    #
    # Gate 6 本该拦住的一切（循环依赖、God Module、死代码、Shotgun Surgery）在 Java
    # 上全部无法检出，而报告声称架构优秀。
    #
    # 这与 #589（Gate 3 恒定 SKIP）、#594（NaN 覆盖率判 PASS）同一形态：**「没去看」
    # 与「看了没问题」必须可区分**，且工具没看的时候不能把它自己的信心照搬过来。
    #
    # 范围说明：architecture.yaml 从未被消费这一点不在本次修复内（那属于新增特性），
    # 作为已知缺口记录，而不是顺手「修好」。
    # ============================================================
    - id: REQ-616
      description: "架构扫描未覆盖项目时须退回评分并说明原因；已覆盖时评分不变"
