---
specification:
  id: SPEC-DSH-001
  name: XP-Gate 移植为 DeepSeek Harness (DSH) 原生插件
  version: "1.0.0"
  source_document: docs/plans/2026-08-23-dsh-plugin-design.md
  delphi_status: APPROVED
  delphi_rounds: 2
  delphi_consensus: "3/3"

  requirements:
    # ============================================================
    # REQ-DSH-001: DSH 插件包脚手架 + bundle patch
    # ============================================================
    - id: REQ-DSH-001
      description: 新增 plugins/dsh/ 包，声明 dsh.bundle.patch 指向 cordis.patch.yml，使 dsh plugin add 后自动进入 bundle 层栈
      priority: critical
      acceptance_criteria:
        - id: AC-DSH-001-01
          criteria: package.json 含 dsh.bundle.patch，cordis.patch.yml insert id=tool-xp-gate；dsh plugin add 后 profile bundles 包含该包
          test_type: integration

    # ============================================================
    # REQ-DSH-002: gate-check 工具
    # ============================================================
    - id: REQ-DSH-002
      description: 注册 gate-check 工具，调用 xp-gate check 对文件/目录运行质量门禁
      priority: critical
      acceptance_criteria:
        - id: AC-DSH-002-01
          criteria: apply(ctx) 调用后 ctx.tools.register 注册了 gate-check，参数含 path(required)/gates(optional)
          test_type: unit

    # ============================================================
    # REQ-DSH-003: gate-principles 工具
    # ============================================================
    - id: REQ-DSH-003
      description: 注册 gate-principles 工具（Gate 4 Clean Code + SOLID 规则检查）
      priority: high
      acceptance_criteria:
        - id: AC-DSH-003-01
          criteria: gate-principles 已注册，execute 调 xp-gate principles <path>
          test_type: unit

    # ============================================================
    # REQ-DSH-004: gate-arch 工具
    # ============================================================
    - id: REQ-DSH-004
      description: 注册 gate-arch 工具（Gate 6 架构校验）
      priority: high
      acceptance_criteria:
        - id: AC-DSH-004-01
          criteria: gate-arch 已注册，execute 调 xp-gate arch
          test_type: unit

    # ============================================================
    # REQ-DSH-005: xp-gate CLI fallback（优雅降级）
    # ============================================================
    - id: REQ-DSH-005
      description: xp-gate CLI fallback（优雅降级）：优先全局 xp-gate，未命中返回清晰可操作提示（工具缺失→SKIP 语义，不抛错不崩），不做 vendored CLI 随包
      priority: critical
      acceptance_criteria:
        - id: AC-DSH-005-01
          criteria: command -v xp-gate 失败时返回优雅降级提示（含安装指引），不抛错不返回门禁失败
          test_type: unit

    # ============================================================
    # REQ-DSH-006: 12 技能随包集成
    # ============================================================
    - id: REQ-DSH-006
      description: 12 个 SKILL.md 技能随包经平台原生 bundledSkillDir（$DSH_BUNDLED_SKILL_DIR）集成，skill 工具可发现/加载
      priority: high
      acceptance_criteria:
        - id: AC-DSH-006-01
          criteria: 12 个 skills/*/SKILL.md frontmatter 满足 DSH 契约（name kebab-case + description 非空）
          test_type: unit

    # ============================================================
    # REQ-DSH-007: 超时与协作式取消分离
    # ============================================================
    - id: REQ-DSH-007
      description: 超时与协作式取消分离：execute 透传 timeoutMs + exec.signal；result.aborted→throw HarnessError(TOOL_ABORTED)，result.timedOut→render 标记不抛
      priority: medium
      acceptance_criteria:
        - id: AC-DSH-007-01
          criteria: result.aborted 时 execute throw 的错误 code === "ABORTED"（不悬挂）；result.timedOut 不抛、render 含超时标记
          test_type: unit

    # ============================================================
    # REQ-DSH-008: 单测覆盖 + TDD
    # ============================================================
    - id: REQ-DSH-008
      description: 单测覆盖三工具注册 + fallback + 取消/超时 + shq 转义；TDD（RED → GREEN → REFACTOR）
      priority: high
      acceptance_criteria:
        - id: AC-DSH-008-01
          criteria: npm test + npm run lint + npx tsc --noEmit 全绿，无既有测试回归
          test_type: e2e

    # ============================================================
    # REQ-DSH-009: 命令注入防护
    # ============================================================
    - id: REQ-DSH-009
      description: 命令注入防护：buildCommand() 纯函数对模型可控输入做 POSIX 单引号 shq() 转义，gates 用 enum 白名单
      priority: critical
      acceptance_criteria:
        - id: AC-DSH-009-01
          criteria: buildCommand 对含 $()/反引号/引号的 path 输出被单引号转义；非法 gates 值被白名单拒绝
          test_type: unit

    # ============================================================
    # REQ-DSH-010: 打包契约
    # ============================================================
    - id: REQ-DSH-010
      description: 打包契约：tsc 编译 src→lib，files 白名单，prepack，publishConfig.access=public，main/exports 指向编译产物
      priority: critical
      acceptance_criteria:
        - id: AC-DSH-010-01
          criteria: npm pack 产出含 lib/index.js + cordis.patch.yml + skills/；main 指向 lib/index.js；publishConfig.access=public
          test_type: integration

    # ============================================================
    # Sprint sprint-20261003-75: P0/P1 质量门禁缺陷修复
    # 设计来源：docs/plans/2026-10-03-p0-p1-gate-defects.md（Delphi R2，共识 100%）
    # ============================================================
    - id: REQ-457
      description: .principlesrc 配置必须真正生效 —— loadConfig 解析并校验配置文件，规则模块在运行时读取生效配置，而非模块加载时固化内置默认值
      # 来源互引（#483 MN-01）：AC-457-17/18 判据由 githooks/__tests__/
      # gate-4-*.test.bats 用例反推补录（6ebbd5a 事故的守卫），防两处
      # gate-4 AC 漂移或重复。
      priority: critical
      acceptance_criteria:
        - id: AC-457-01
          criteria: 传入 --config <path> 时，large-file.threshold 等数值项按该文件生效
          test_type: unit
        - id: AC-457-02
          criteria: 未传 --config 时回退到 git toplevel 的 .principlesrc；该文件不存在才用内置默认值
          test_type: unit
        - id: AC-457-03
          criteria: --config 的取值不得被当作待分析的源文件
          test_type: unit
        - id: AC-457-04
          criteria: 规则项 enabled:false 时该规则不产出任何违规
          test_type: unit
        - id: AC-457-05
          criteria: 类型不匹配的配置项回退内置默认值并告警，不得抛异常
          test_type: unit
        - id: AC-457-06
          criteria: getDefaultConfig() 每次返回全新副本，调用方修改互不影响
          test_type: unit
        - id: AC-457-07
          criteria: main() 退出码由 errorCount 决定，info 级别违规不得让 Gate 4 降级为 SKIPPED
          test_type: unit
        - id: AC-457-08
          criteria: ERROR 级违规退出码为 1、无违规时为 0（经真实子进程验证）
          test_type: integration
        - id: AC-457-09
          criteria: 检查器自身崩溃退出码为 2（区别于 1），Gate 4 据此区分「有发现」与「工具故障」，
            error 级违规必须 BLOCK 而不得走 SKIP 分支放行
          test_type: integration
        - id: AC-457-10
          criteria: rules 之外的嵌套段（output / performance）同样深合并，
            用户只写其中一个键时其余默认值不得丢失
          test_type: unit
        - id: AC-457-11
          criteria: severity 必须按 error/warning/info 词表校验；写成 "Error" 等词表外的值时
            保留默认值并给出明确告警，不得静默生效而使规则悄悄失去阻断能力。
            checker 的 stderr（配置告警的唯一出口）不得被门禁丢弃
          test_type: unit
        - id: AC-457-12
          criteria: 配置解析路径上的 git 调用（含 gitToplevel）必须带超时上限，
            git 卡死或不可用时回退到 cwd / 内置默认值，不得挂住 pre-commit hook
          test_type: unit
        - id: AC-457-13
          criteria: rule ID 必须是「单个点」的 group.name 形式且 group 在配置中真实存在，
            否则 isRuleEnabled 的首个点切分会解析到错误条目并静默沿用内置阈值
          test_type: unit
        - id: AC-457-14
          criteria: 调用方显式传入的 --config 路径不存在时必须失败（加载抛错、CLI 退出码 2），
            不得回退内置默认值——声明了配置却找不到文件属于配置错误，静默沿用默认值正是「#457」要消除的 fail-open；
            未显式传入时「项目没有 .principlesrc」仍按正常状态回退默认值
          test_type: integration
        - id: AC-457-15
          criteria: 未先 resetActiveConfig() 就替换已安装的进程级配置必须给出可见告警，
            并发/多项目约束不得只停留在注释里；正常单次 set 生命周期不得产生告警噪音
          test_type: unit
        - id: AC-457-16
          criteria: getEffectiveConfigFor(ruleId) 返回当前生效配置中该规则的条目（与 check() 读到的同一对象），
            未知 ID 或非 group.name 形式必须报错而非回退默认值；
            Rule.threshold / Rule.severity 的过期快照不再是消费方可读取的生效来源
          test_type: unit
        - id: AC-457-17
          criteria: 检查器报告不得写入固定的共享路径——Gate 4 各副本必须用每次调用独立的临时文件，
            且不得存在任何写向 /tmp/principles-output.json 之类的固定路径
          test_type: integration
        - id: AC-457-18
          criteria: 同机两次 Gate 4 运行互不遮蔽：一次零违规运行不得让另一次带 error 级违规的运行变成 PASS
          test_type: integration
        - id: AC-457-19
          criteria: Delphi runner 在发送前按 UTF-8 字节度量 system+user 提示并拒绝超限请求
            （默认 40000 字节，席位可用 max_prompt_bytes 覆盖；非法覆盖值回退默认而不是关闭守卫，
            且「已设置但无法生效」的覆盖值必须发出可见告警，未设置与合法值保持静默）
          test_type: unit
        - id: AC-457-20
          criteria: 超限拒绝必须可执行——报错点明如何缩小范围或提高该席位预算，
            并在 stdout 以 error_type=prompt_budget_exceeded 告知编排方「未发出请求」，
            与「模型答错」区分；不得让席位以 "Network error." 形态崩溃
          test_type: unit

    - id: REQ-452
      description: Boy Scout baseline 必须可剪枝 —— 已删除文件的条目不得长期滞留并继承旧的警告额度
      priority: high
      acceptance_criteria:
        - id: AC-452-10
          criteria: pruneBaselineEntries 只删除「磁盘不存在 且 git 未跟踪」的条目（双重确认）
          test_type: unit
        - id: AC-452-11
          criteria: git 不可用时全部条目保留（fail-closed）
          test_type: unit
        - id: AC-452-12
          criteria: 默认 dry-run 不写盘；--apply 才落盘，且只删除过期条目
          test_type: unit
        - id: AC-452-13
          criteria: baseline 格式非法时保留原文件并报错，不得判定为「全部过期」
          test_type: unit
        - id: AC-452-14
          criteria: git 调用必须带超时上限；git 不可用时保留全部条目并显式报告原因，
            不得静默伪装成「无过期条目」
          test_type: unit
        - id: AC-452-15
          criteria: .warnings-baseline.json 中每条额度都必须对应该文件当前真实存在的告警数——
            已清零的文件不得留下幽灵额度（幽灵额度等于日后偷偷加回同量告警的许可），
            条目计数也不得高于当前实测值
          test_type: unit

    - id: REQ-454
      description: Gate 5 必须区分 vitest runner 基础设施错误与真实测试失败 —— 同一判定逻辑覆盖全部 vitest 调用点
      priority: critical
      acceptance_criteria:
        - id: AC-454-01
          criteria: 全部 vitest 调用点经由 handle_test_failure 统一判定，输出显式传入而非读全局
          test_type: unit
        - id: AC-454-02
          criteria: 仅含 Unhandled Error 且 0 个失败测试的输出判为 SKIP（TESTS_SKIPPED=true）
          test_type: unit
        - id: AC-454-03
          criteria: 同时含 runner 噪音与真实失败测试时必须 BLOCK，不得因噪音放行
          test_type: unit
        - id: AC-454-04
          criteria: 非 vitest 的通用兜底分支保持不加守卫（其输出格式无保证）
          test_type: unit
        - id: AC-454-05
          criteria: 全量通过的测试运行判为 PASS（守卫接入不得改变正常路径）
          test_type: integration
        - id: AC-454-06
          criteria: 通用 run_tests 兜底分支不得调用 handle_test_failure，
            其手写的 BLOCKED 只允许出现在该兜底路径里
          test_type: unit
        - id: AC-454-07
          criteria: runner-error 判别模式所依赖的 vitest 大版本必须写进声明处并被测试钉住：
            package.json 里 vitest 的声明一旦离开既定大版本，测试立刻失败并说明要重新核对哪些输出形态
          test_type: unit
        - id: AC-454-08
          criteria: pre-commit 只启用 set -o pipefail、不启用 errexit（Gate 4 的状态捕获习语以此为前提），
            Gate 4 各副本必须以 `|| PRINCIPLES_EXIT=$?` 内联取状态；
            并含一个真跑 `set -e` 证明两种写法分化的反空洞用例
          test_type: unit

    - id: REQ-423
      description: Gate MW 证据必须证明模型来源 —— channel 为显式白名单，resolved_model 必须非空且互异，杜绝伪造
      priority: critical
      acceptance_criteria:
        - id: AC-423-01
          criteria: 三个互异的真实模型且 channel 为 external/local 时校验通过
          test_type: unit
        - id: AC-423-02
          criteria: channel 缺失、未知、大小写不符、非字符串时一律失败（不得默认取值）
          test_type: unit
        - id: AC-423-03
          criteria: resolved_model 重复或为 null 时失败
          test_type: unit
        - id: AC-423-04
          criteria: resolved_model 比较前 trim 并转小写，大小写变体视为重复
          test_type: unit
        - id: AC-423-05
          criteria: 生产者遇网关未回传 model 时报硬错误，不写入 null
          test_type: unit
        - id: AC-423-06
          criteria: requested_model 去重校验保持有效
          test_type: unit
        - id: AC-423-07
          criteria: 瞬态走查证据 .code-walkthrough-result.json 不被仓库跟踪（.gitignore 规则已存在，跟踪状态才是漏洞）
          test_type: unit
        - id: AC-423-08
          criteria: requested_model 与 resolved_model 的查重大小写敏感性刻意不对称——前者按 AGENTS.md 的
            「distinct trimmed requested model IDs」只做 trim、区分大小写，后者 trim 后转小写；
            测试须把这一不对称钉住，而不是把两边统一
          test_type: unit

    - id: REQ-473
      description: Gate 5 子集运行不得假阻断，且抽取出的 hook 库必须被安装器完整落地 —— 部分运行的覆盖率阈值缺口只豁免阈值本身，真实断言失败仍然阻断
      priority: critical
      acceptance_criteria:
        - id: AC-473-01
          criteria: 子集 vitest 运行只报覆盖率阈值不达标时，Gate 5 判定为豁免并继续走下游 PARTIAL_TEST_RUN 的降级告警；
            同一分支遇到真实断言失败仍必须 BLOCK，且豁免路径不得置 TESTS_SKIPPED（覆盖率门禁保持有效）
          test_type: integration
        - id: AC-473-02
          criteria: 阈值豁免的判定逻辑位于 githooks/lib/test-failure.sh，并由一个真跑 pre-commit 的用例证明端到端接线，
            而不只是可单测
          test_type: integration
        - id: AC-473-03
          criteria: install.sh 把 githooks/lib 下每个 .sh 逐字节安装到 .git/hooks/lib，缺文件或内容不一致即失败
          test_type: integration
        - id: AC-473-04
          criteria: 已安装的 hook 库不得 source lib/ 之外的路径（../、/scripts/、/src/），
            否则换台机器就找不到文件；同目录兄弟引用不算违规（反空洞用例分别证伪与证实）
          test_type: integration

    - id: REQ-478
      description: Gate 4 必须以调用参数同一基准的目录运行检查器 —— pre-commit 已 cd 进单语言子目录时，
        仓库根相对的 diff 路径会被检查器读成 web/web/...，可用的门禁静默退化为 SKIPPED（#478）
      # 来源互引（#483 MN-01）：AC-478-01..04 判据由 gate-4-subdir-paths.test.bats
      # 用例反推补录（edec9f3），防与 REQ-457 的 gate-4 AC 漂移或重复。
      priority: critical
      acceptance_criteria:
        - id: AC-478-01
          criteria: 子项目模式（PROJECT_SUBDIR=web 且 ORIGINAL_DIR 已设置）下检查器的工作目录必须等于
            PROJECT_ROOT，传给 --files 的路径保持仓库根相对（web/src/api/index.ts，不得出现双重前缀），
            结果判为 PASS 且不得出现 SKIPPED
          test_type: integration
        - id: AC-478-02
          criteria: 没有子项目布局的仓库（PROJECT_SUBDIR 与 ORIGINAL_DIR 均为空）仍须 PASS，
            且检查器的工作目录同样是 PROJECT_ROOT
          test_type: integration
        - id: AC-478-03
          criteria: 检查器真的无法启动/读不到文件时判为 SKIP，不得判为 PASS —— 工具失败与「零发现」
            必须是两种可区分的状态（反假 PASS）
          test_type: integration
        - id: AC-478-04
          criteria: 反空洞用例逐份检查随包分发的 gate-4 副本（githooks/gate-4.sh、
            githooks/adapters/gate-4.sh），每份都必须以 PROJECT_ROOT 解析检查器基目录，
            并从该同一基目录调用检查器；任一副本回退到 hook 当前目录即失败
          test_type: integration

    - id: REQ-489
      description: 被 source 进 pre-commit 的 gate 模块不得把 errexit 泄漏给钩子进程 ——
        任何 `set -e` 泄漏都会让 generate_quality_report 里第一条零命中管道
        （FAIL_LINES 提取）在全部门打印 PASS 之后杀死钩子，提交静默不落（#489）
      priority: critical
      acceptance_criteria:
        - id: AC-489-01
          criteria: source 任一份随仓/随包分发的 gate-4 副本（githooks/gate-4.sh、
            githooks/adapters/gate-4.sh、githooks/gates/gate-4-principles.sh）后 errexit
            必须保持关闭，且紧随其后的零命中 grep 管道（无 || true）不得终止钩子；
            探针须运行在全新 bash 进程里，避免 bats `run` 自身的 errexit 抑制掩盖泄漏
          test_type: integration
        - id: AC-489-02
          criteria: 每一份随包分发的 pre-commit（githooks/pre-commit、
            src/npm-package/hooks/pre-commit）中 FAIL_LINES 提取管道必须以 `|| true`
            收尾（grep 零命中返回 1，被 pipefail 放大为整条管道 1），并按 v0.9.2
            head→sed 迁移约定以 `sed -n '1,10p'` 取代 `| head -10`
          test_type: integration
        - id: AC-489-03
          criteria: 反空洞用例：同一探针对着历史泄漏写法（`set +e` 包裹后无条件
            `set -e` 恢复）必须在 FAIL_LINES 赋值处死亡（exit 1、无 SURVIVED），
            证明回归用例本身能抓住该缺陷
          test_type: integration

    - id: REQ-490
      description: Gate 10 必须把暂存文件列表拆成独立参数传给 semgrep —— 引号包裹的
        换行连接列表会被当成一个扫描目标，暂存 ≥2 个受支持文件时 semgrep 报
