    # .xp-gate-powershell-prune-dirs 里列一遍。
    # 来自已安装副本（有这四项，仓库没有）。新增条目不得删除任何既有条目——
    # wrc-drill 等 #538 条目由各自套件继续固化。
    # ============================================================
    - id: REQ-577
      description: "PowerShell 发现流程剪掉 .xp-gate/.vscode/.idea/.qoder 等 AI 与 IDE 生成目录"
