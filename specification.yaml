    #      result 为 null，无重试可言。
    #   3. check-alignment-cli 用裸 node spawn 一个 require('.ts') 的 runner。
    #      裸 node 只在 22.6+ 支持类型剥离，CI 钉 Node 20.x 会抛错、stdout 为空，
