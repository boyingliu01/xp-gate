          test_type: unit
        - id: AC-599-02
          criteria: 断言门禁行为的测试必须自证非空转：抽取出的代码块须先通过语法校验且包含被测守卫，解析失败时测试自身报错而非静默通过
          test_type: unit
        - id: AC-599-03
          criteria: 门禁状态在报告中的渲染默认值不得为 PASS：未被赋值的门禁必须渲染为 SKIP，已赋值为 PASS 的门禁仍须渲染为 PASS
