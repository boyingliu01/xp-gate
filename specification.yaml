    # ============================================================
    # REQ-600: Gate 11 只能为「真正校验过的 sprint」判 PASS。
    # #584：sprint-gate.sh 的 `allow` 同时表示三种完全不同的结论——
    #   checks-passed（真校验过）、phase-not-reached（还没到该门要求的相位）、
    #   no-json-parser（根本读不出来）。pre-commit 的 `case allow) PASS` 把三者
    #   一律映射成 PASS，于是本仓库 sprint 已过期 21 天、.sprint-state/ 被 gitignore
    #   且 phase=0 时，Gate 11 仍报 PASS：PASSED_COUNT +1、质量分变好、VERDICT 不受影响。
    # 「不适用」是合法结果，把它写成 PASS 不是。
    # 注：编号避开 REQ-584（已被 lizard 版本固定占用）、REQ-599（本轮 fail-open 批次）。
    # ============================================================
    - id: REQ-600
      description: "Gate 11 必须区分「校验通过」与「未校验」，后者不得判 PASS"
      priority: critical
      acceptance_criteria:
        - id: AC-600-01
          criteria: sprint-gate.sh 的每个 allow 必须携带 allow_reason，区分 checks-passed（真正校验通过）、
            phase-not-reached（未到该门要求的相位）与 no-json-parser（无法读取状态）；
            未到相位不得声称 checks-passed；过期 sprint 必须 skip 而非 allow
          test_type: unit
        - id: AC-600-02
          criteria: pre-commit 的 Gate 11 只有在 allow_reason 为 checks-passed 时才可判 PASS；
            其余 allow（含未携带理由的旧版输出）必须判 SKIP 并打印真实理由，不得计入 PASSED_COUNT，
            不得提高质量分；checks-passed 必须仍然判 PASS
          test_type: unit


    # ============================================================
    # REQ-601: Gate 5 的覆盖率判定不得把「算不出数字」当成「达标」。
    #
    # #594 实测：TypeScript 分支用
    #     console.log(Math.round(data.total.lines.pct))
    # 读取报告，用 `!= "parse_error"` 和 `-n` 两个守卫拦截失败。两个都拦不住
    # NaN——Math.round() 对非数字输入不抛异常，它返回 NaN 并正常打印：
    #     $ node -e 'console.log(Math.round("Unknown"))'
    #     NaN
    # istanbul 对「没有可执行行」的文件就输出 "Unknown"，子集跑也可能让 total
    # 不可用，所以这条路径真实可达。
    #
    # 第二半是 bash：`[ "NaN" -lt 80 ]` 不是 false，是 ERROR（退出码 2，打印
    # "integer expression expected"）。`if` 只区分 0 与非 0，于是错误进了 else
    # ——也就是通过分支。现场症状：
    #     TypeScript coverage: NaN% ✅ (≥ 80%)
    #     pre-commit: line 3041: [: NaN: integer expression expected
    # ✅ 和 bash 报错相邻，而裁决取的是 ✅。
    #
    # 这与项目在 #449 / #499 / #570 立下的原则是同一条：拿不到证据不得声称
    # 通过。Gate 8 在 gitleaks 无报告时就是这么做的。
    - id: REQ-601
      description: "Gate 5 的覆盖率百分比必须先在源头拒绝 NaN，再在判定处校验其为整数；
        无法测量时必须 BLOCK，不得 PASS"
      priority: critical
      acceptance_criteria:
        - id: AC-601-01
          criteria: 覆盖率为 NaN（含 istanbul 输出的 Unknown）时，输出中不得出现
            TypeScript coverage NaN 通过 字样，也不得出现 bash 的
            integer expression expected；解析阶段必须把非有限数值折叠为
            no_data 而非打印 NaN
          test_type: unit
        - id: AC-601-02
          criteria: 覆盖率无法测量（NaN / Unknown / 报告形状不可用）时必须 BLOCK 且
            退出码非 0，与 #570 的「无法测量不得放过」一致
          test_type: unit
        - id: AC-601-03
          criteria: 真实数字的判定不被破坏——低于 80% 必须 BLOCK，达到 80% 必须 PASS，
            且报告里出现的是实测值而非占位符
          test_type: unit

