    # ============================================================
    # REQ-578: 两个声明文件必须剥离 UTF-8 BOM。
    # 本项目的声明文件在 Windows 上编辑，而 PowerShell 5.1 的
    # `Set-Content -Encoding UTF8` 会写 BOM。首行于是以 EF BB BF 开头——编辑器里
    # 看不见，字节比较里到处都在。
    # 对 .xp-gate-powershell-analysis-paths 这不是美观问题：BOM 粘在第一个条目上，
    #   <BOM>src/product 变成一个不存在的路径 -> 报告 analysis-path-missing
    #   -> 且自 #576 起返回 3 -> 一个完全合法的作用域声明让它之后每次 PowerShell
    #   提交都 fail-closed。用户看到"产品代码可能逃出了门禁"，而这个文件唯一的
    #   罪过是它的字节序标记。
    # '#' 头注释同理：BOM 在 '#' 前面，字节比较就不再认为它是注释，注释变成幽灵路径。
    # ============================================================
    - id: REQ-578
      description: "作用域与剪枝声明文件必须剥离 UTF-8 BOM，避免首行条目被当成不存在的路径"
      priority: high
      acceptance_criteria:
        - id: AC-578-01
          criteria: 首行带 BOM 的作用域条目仍被正确识别，不得被报成 analysis-path-missing，也不得因此返回 3
          test_type: unit
        - id: AC-578-02
          criteria: BOM 位于 '#' 头注释前时，该行仍被当作注释，不得变成幽灵路径
          test_type: unit

    # ============================================================
    # REQ-579: 覆盖率 0% 是「测了但没覆盖」这一数据，不是「无法判定」。
    # Gate 5 区分三种结局：达标、低于阈值（BLOCK）、无法判定（WARN 不阻断）。
    # 第三种刻意宽松——报告格式不识别不该阻断。但原来的守卫写的是：
    #     if [ ... ] && [ "$COVERAGE_PERCENT" -gt 0 ]; then
    # `-gt 0` 把实测的 0% 归进了「无法判定」：0% 意味着 coverage.py 跑了、
    # 什么都没覆盖，套件执行了却什么都没证明；「无法判定」意味着根本没产出证据。
    # 两者不是同一个主张。于是 0% 覆盖只得到一条 WARNING 且门禁 PASSED——
    # 又一次「跳过即通过」：写着「什么都没测」的数字被读成了「没有数字」。
    # 该修复先出现在已安装副本的 pre-commit 里（`-ge 0` 并附说明），仓库没有。
    # 此处连同测试固化，防止再次丢失。
    # ============================================================
    - id: REQ-579
      description: "Gate 5 覆盖率守卫必须把实测 0% 当作数据交给阈值比较，而不是归入「无法判定」"
      priority: high
      acceptance_criteria:
        - id: AC-579-01
          criteria: 实测 0% 覆盖必须被判定为「已测量」并进入阈值比较（从而 BLOCK），不得落入「无法判定」的 WARN 分支
          test_type: unit
        - id: AC-579-02
          criteria: 空值、parse_error 与非数字值仍必须落入「无法判定」的 WARN 分支，不得被当成已测量
          test_type: unit

    # ============================================================
    # REQ-580: pre-push 日志的 score 必须是「实际跑过的门」的度量，而非 verdict 的复述。
    # 原来写的是 '10.0/10' if verdict == 'PASS' else '0.0/10'。当所有门都 SKIP
    # （只改文档的推送、无受支持语言、工具缺失），日志记 0.0/10——读者会读成
    # 「所有门都挂了」，而这是关于代码的、从未被检验过的断言。诚实的表述是「没有测量」。
    # 两种状态被折叠进一个数字：
    #   - 有门跑过、部分失败 -> 低分是真实的，有用
    #   - 所有门都 SKIP      -> 没有分数，日志必须如此声明
    # 因此取 None 而非 0：字段为 null，迫读者去看 verdict 与各门状态。
    # 同时补记 gates_run / gates_skipped 供分辨。
    # ============================================================
    - id: REQ-580
      description: "pre-push 日志 score 必须按实际执行的门计算，无门执行时为 null 而非 0.0/10"
      priority: high
      acceptance_criteria:
        - id: AC-580-01
          criteria: 所有门都 SKIP 时 score 必须为 null，不得记 0.0/10
          test_type: unit
        - id: AC-580-02
          criteria: 实际执行的门全 PASS、且执行数达到总数的一半以上时，score 必须为 10.0/10（分母只计已执行的门）；
            执行数未过半时不得给出分数，必须写 null 并在 score_scope 说明「门数太少无法概括」
          test_type: unit
        - id: AC-580-03
          criteria: 存在真实失败时仍必须给出真实的低分（如 1 PASS 6 FAIL 必须是低于 10.0/10 的真实数字），不得因本次修复而掩盖失败
          test_type: unit
        - id: AC-580-04
          criteria: prepush-score.py 缺席时 pre-push 必须 fail-closed 报错并给出修复方式，不得只发警告后继续；
            不得写出一个看起来已生成、却什么都不含的 journal（score/gates_run 为 null）冒充测量结果
          test_type: unit

    # ============================================================
    # REQ-581: ESLint 必须与 .gitignore 对「生成物非源码」的判断保持一致。
    # Stryker 会把 src/ 的副本放进 .stryker-tmp/sandbox-*/，而 ESLint 未忽略它。
    # 实测（跑过变异测试的机器上）：
    #     npx eslint . --max-warnings 0
    #     ✖ 73 problems (64 errors, 9 warnings)
    # 同一 commit 在 CI 只有 8 个 warning。64 个 error 全在 .stryker-tmp/sandbox-*/ 里，
    # 而 .gitignore 已经排除了它（第 119 行），ESLint 配置没有。
    # 后果比噪声更糟：一个只在跑过 Stryker 的机器上复现的 lint 失败，要么让人
    # 去追不存在的错误，要么（更可能）教会大家「npm run lint 红了不算数」——
    # 真实失败正是这样被放过去的。
    # 同时清理掉 8 个既存 warning（两条失效的 eslint-disable、测试桩空方法注释）。
    # ============================================================
    - id: REQ-581
      description: "ESLint 必须忽略 .stryker-tmp/.delphi-work 等 gitignored 生成目录，保证本地与 CI 的 lint 结果一致"
      priority: high
      acceptance_criteria:
        - id: AC-581-01
          criteria: .stryker-tmp/ 已被 .gitignore 排除时，也必须出现在 ESLint 的 ignores 列表中
          test_type: unit
        - id: AC-581-02
          criteria: 新增忽略项不得导致既有忽略项（node_modules、dist、coverage）消失
          test_type: unit

    # ============================================================
    # REQ-582: 复杂度棘轮的记录值必须与分析器一致。
    # .ccn-baseline.json 记录每个函数的圈复杂度，CI 在函数比记录更差时阻断。
    # 棘轮只有在记录的数值为真时才起作用。
    # src/mutation/update-baseline.ts::saveBaseline 被记为 CCN=1，而该函数有三条
    # 决策路径（try/catch、Error 判型三元）。实测：
    #     lizard ... -> CCN=3
    #     node scripts/ccn-report.cjs --check --baseline .ccn-baseline.json
    #     BLOCK src/mutation/update-baseline.ts:136 saveBaseline CCN=3 baseline=1
    # 函数并没有变差——是基线记录取自更早的函数体，补上错误处理后没刷新。
    # 后果是 Gate 3 永久红，看起来像代码问题：读者无从分辨「真有回归」与「记录过期」，
    # 而其余所有真实回归都藏在这条假警报后面。棘轮从此不再有信号。
    # ============================================================
    - id: REQ-582
      description: "复杂度棘轮基线记录值必须与分析器一致，过期记录不得伪装成回归"
      priority: high
      acceptance_criteria:
        - id: AC-582-01
          criteria: saveBaseline 在 .ccn-baseline.json 中记录的值必须等于分析器报出的 CCN
          test_type: unit
        - id: AC-582-02
          criteria: 本仓库上 ccn-report --check 不得报告任何 BLOCK，且必须以 0 退出
          test_type: unit

    # ============================================================
    # REQ-583: fail-closed 的门禁必须同时把它的工具装进 CI。
    # Gate 3 在分析器缺失时阻断（#499 的理由：跑不了的安全/质量门不得报通过）。这是
    # 对的——但也意味着 lizard 是硬前置依赖，CI 必须安装它。
    # quality-gates.yml 装了 ruff/mypy/pylint，唯独没装 lizard，于是 Gate 3 每次
    # 都撞上自己的守卫：
    #     ❌ lizard is not installed — Gate 3 cannot run.
    # 一道永远红的门比没有门更糟：它无法区分「代码变复杂了」与「分析器缺失」，
    # 信号就丢了；而管道长期红会教会所有人忽略它。此前这个问题被 Gate 1 的
    # ESLint 警告先挡住（#581），修完才露出下一堵墙。
    # ============================================================
    - id: REQ-583
      description: "CI 必须安装 Gate 3 硬依赖的 lizard，使 fail-closed 门禁有可用前置条件"
      priority: critical
      acceptance_criteria:
        - id: AC-583-01
          criteria: quality-gates.yml 在因 lizard 缺失而 fail-closed 的同时，必须包含安装 lizard 的步骤
          test_type: unit
        - id: AC-583-02
          criteria: 其余 fail-closed 工具前置（ruff、mypy、pylint）必须保持被安装，防止同类缺陷复发
          test_type: unit
        - id: AC-583-03
          criteria: lizard 必须安装在「运行 Gate 3 的那个 job」内；装在其它 job 等于没装，因为 GitHub Actions 的 job 之间不共享文件系统
          test_type: unit

    # ============================================================
    # REQ-584: Gate 3 的分析器版本必须固定。
    # .ccn-baseline.json 以 `file::function` 为键、CCN 为值，所以「检查基线的分析器」
    # 必须就是「生成基线的分析器」。此前没有钉版本，CI 与开发者静默跑了不同版本。
    # 同一文件、同一 commit 实测差异：
    #     lizard 1.21.3: findBodyBrace@64-191 CCN=69       （一个大函数）
    #     lizard 1.24.2: findBodyBrace@64-90 CCN=8
    #                    findDeclarationBrace@110-139 CCN=18  ← 1.21.3 看不见
    #                    maskLiterals@242-329 CCN=36          ← 1.21.3 看不见
    # 1.24.2 能单独识别 1.21.3 会吞进父函数的嵌套函数。两者都不算错，但「什么是一个函数」
    # 的判断不同。于是拿 1.21.3 生成的基线去验收 1.24.2，所有新出现的函数都被报成
    # 「new function over block threshold」，门禁吐出 40+ 条 BLOCK 描述的是分析器而不是代码。
