    # ============================================================
    # REQ-563: standalone 门禁的判定必须原样传播 —— 派生一个 0 等于没有门禁。
    # runGate() 只在 run() 返回 Promise 时 await 并返回，同步返回数字的分支
    # 一律 return 0。Gate 3/7/8/9 经 runTsGate() 返回的正是数字，于是子进程
    # exit 1 在 xp-gate check 里被报告为 0 —— checkAllGates 忠实地统计它拿到
    # 的返回值，而那个返回值是被伪造的。Gate 4/6 因恰好返回
    # Promise.resolve() 而幸免，Gate 2 因 execFileSync 非零即抛而幸免，两者都是
    # 写法上的偶然而非契约，所以修复必须在 runner 里而不是在各 handler 里。
    # 来源：v0.30.5 自审（报告阶段 0 动作 0.1）。
    # ============================================================
    - id: REQ-563
      description: "runGate 必须把同步 handler 的数值判定当作真实结果返回；只有未返回数值（失败信号为抛异常）的 handler 才视为通过"
      priority: critical
      acceptance_criteria:
        - id: AC-563-01
          criteria: 同步返回非零（如 1）的 gate handler，runGate 必须返回该非零值，
            不得返回伪造的 0；否则 checkAllGates 无法区分通过与失败
          test_type: unit
        - id: AC-563-02
          criteria: 同步返回 0 的 handler 仍判定为通过——防止「一律返回失败」式的伪修复
          test_type: unit
        - id: AC-563-03
          criteria: 返回 Promise 的 handler、同步抛异常的 handler、以及 Promise reject 的
            handler 判定不变（分别为返回值、1、1），不得因本次修复而回归或产生未捕获拒绝
          test_type: unit

    # ============================================================
    # REQ-564: 质量分不能因为门禁被跳过而升高。
    # score = PASSED_COUNT / EFFECTIVE_TOTAL，而 EFFECTIVE_TOTAL = TOTAL - SKIPPED，
    # 于是 SKIP 从分母里消失而不是计入扣分。按已发布公式算：
    #   1 过 11 跳 -> 有效 1 -> 10.0   |   3 过 9 跳 -> 有效 3 -> 10.0
    #   10 过 2 跳 -> 有效 10 -> 10.0
    # 只跑 12 道里 1 道，与跑 10 道报同一个 10.0/10。这不是假设：
    # .quality-history.jsonl 最近 100 次里 Gate 3 只跑了 7%、Gate 4 只跑了 8%，
    # 而这些运行全部记录了 score 10 / effectivePassRate 100 —— 跳过反而加分。
    # verdict 已有 SKIP-ALL 保护，缺口只在 score/effectivePassRate 这两个没带
    # 任何限定语、却被当作可跨运行比较的数字上。
    # ============================================================
    - id: REQ-564
      description: "质量报告必须同时给出跳过计入分母的全量分与真正执行的门禁数，使跳过无法抬高分数"
      priority: high
      acceptance_criteria:
        - id: AC-564-01
          criteria: 报告 overall 里存在数值型的 scoreAllGates（pass/total*10）与 gatesRan，
            且 gatesRan == gatesTotal - gatesSkipped
          test_type: unit
        - id: AC-564-02
          criteria: 同一批门禁，执行得越多 scoreAllGates 越高；且 scoreAllGates 严格小于
            有效分（只要存在跳过），从而无法被跳过抬高
          test_type: unit
        - id: AC-564-03
          criteria: 全部门禁 SKIP 时 verdict 为 SKIP-ALL、有效分为 null（沿用 issue 507 的
            number-or-null 契约）、gatesRan 为 0，绝不呈现伪造的满分
          test_type: unit

