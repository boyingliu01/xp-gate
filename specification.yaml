      acceptance_criteria:
        - id: AC-616-01
          criteria: 分析文件数远低于项目源文件数时须退回评分并给出覆盖缺口；已覆盖时评分照常；
            项目规模未知时不得凭猜测退回
          test_type: unit
        - id: AC-616-02
