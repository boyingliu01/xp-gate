    # 于是每个超过体积阈值的 hook 都被判 not parseable —— doctor 对完全健康的
    # hook 报 FAIL，且错误信息里点名的路径根本不存在，把人引去找丢失的文件。
    # 实测（本机真实安装的 pre-push，同一文件从 Git bash 里 bash -n 报 PARSE_OK）：
    #   path.join -> "C:\\Users\\think\\.config\\xp-gate\\hooks\\pre-push"
    #   verdict   -> "/bin/bash: C:Usersthink.configxp-gatehookspre-push:
    #                 No such file or directory"
    # 注：这与 REQ-469 的 WSL 桩问题是两回事——那是"选错 bash"，这是"bash 选对了
    # 但路径喂错了"。审计报告 §2.2 把两者混为一谈，见 issue #563 的更正。
    # ============================================================
    - id: REQ-566
      description: "bash -n 探针必须把原生路径转成 bash 能打开的 POSIX 形式；转换本身与转换后的判定都要可断言"
