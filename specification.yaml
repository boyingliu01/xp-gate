          test_type: unit
        - id: AC-616-03
          criteria: JS/TS 项目的真实评分与发现数不得改变；不可解析的报告仍须 fail closed
          test_type: unit


    # ============================================================
    # REQ-617: Java 成员计数须数「声明」而不是「调用点」。
    #
    # #587：countMembers 的正则是「标识符后跟 `(`」，在 Java 里那绝大多数是**调用点**。
    # 方法体里的一切都被算成成员：builder.append(x)、Objects.requireNonNull(o)、
    # new SQLException(...)、lambda 里的 foo(x)。去重只按名字，于是观测到两个现象：
    # 偏高但有界，且虚增幅度与类的调用密度强相关。
    # 实测 WhaleAuditFilter 127 vs 42，一个正常的 24 方法类被报成 41。
    #
    # clean-code.god-class 与 solid.srp 默认阈值都是 30，在 Java 上因此基本失去区分力。
    # 用户唯一合规解法是调高阈值，而调高之后对真正的大类也失效了——与 #507 S4 同一处的
    # 后续问题：计数有了，但语义错了，同样让规则失效，只是从「永远不报」变成「总是报」。
    #
    # 判据是行的形状（行首 + 修饰符 + 返回类型 + 名字 + 参数表 + `{`|`;`）以及**花括号深度**
    # （只有类体自身深度 1 的声明才算，嵌套类/匿名类的方法不算）。
    # ============================================================
    - id: REQ-617
      description: "Java 成员计数须只数声明，须区分重载，须排除嵌套类方法"
      priority: high
      acceptance_criteria:
        - id: AC-617-01
          criteria: 只统计方法声明，方法体内的方法调用、对象构造与 lambda 调用不得计入
          test_type: unit
        - id: AC-617-02
          criteria: 重载须各自计数（不按名字去重）；构造器计入；嵌套类与匿名类的方法不计入外层类
          test_type: unit
        - id: AC-617-03
          criteria: 接口的抽象方法（以分号结尾）须计入；泛型/数组返回类型与跨行 throws 不得导致漏计；
            注解不得成为成员
          test_type: unit


    # ============================================================
    # REQ-618: solid.lsp 在无法判定时须保持沉默，不得把「解析失败」当「违规」。
    #
    # #588：Java 项目上 solid.lsp 对**每一个有 extends 的类**都报违规，参数类型是垃圾
    # （int / String / Engine / false / public / m / i……）。这不是门禁，是常量。
    #
    # 两个独立缺陷：
    #   1. extractParamType 只认 TypeScript 的 `name: Type`；Java 是 `Type name`，
    #      于是绝大多数参数解析为 null，偶尔含冒号时解析出垃圾类型；
    #   2. isCompatibleParamType 以 `return false` 收尾，于是**「解析不出类型」被当成
    #      「不兼容」**。这是 fail-open 的反面、同样错误：在不认识的语言上，每个方法
    #      都成了违规。
    #
    # 另外 `\w+\s*\(([^)]+)\)` 匹配的是调用点，`foo(a, b)` 被逗号切分后 a/b 成了参数。
    #
    # 采纳 issue 建议 3 作为承载点：「无法判定」必须意味着「不报」，而不是「报」。
    # LSP 判定需要基类，单文件正则分析没有基类，所以诚实的行为是保持安静。
    #
    # 教训记录：本 issue 的第一次修复通过了自测，但反向验证 AV2/AV3 打不动——因为
    # 「解析了并判定无法确定」与「根本没解析」在规则输出上完全一致。因此解析层单独导出
    # 并直接断言，而不是只断言规则的最终判定。
    # ============================================================
    - id: REQ-618
      description: "solid.lsp 无可判定依据时须不报；Java/TS 参数语法须各自正确解析"
      priority: high
      acceptance_criteria:
        - id: AC-618-01
          criteria: 普通 Java 子类与其方法体中的调用点均不得产生 LSP 违规
          test_type: unit
        - id: AC-618-02
          criteria: 无法判定的参数类型须沉默而非判违规；Java 的 `Type name` 须解析出类型而非参数名；
            声明与调用点须可区分
          test_type: unit
        - id: AC-618-03
          criteria: 可判定为不兼容的情形须仍可报告；违规消息不得出现非类型的 token
          test_type: unit
        - id: AC-618-04
          criteria: 基类契约在同文件内可见时须据其判定——重写方法的参数类型若基类不接受则报违规，
            接受则不报
          test_type: unit
        - id: AC-618-05
          criteria: 基类不在同文件、或基类未声明该方法时须沉默；基类以限定名引用时须正确解析
          test_type: unit


    - id: DD-001
      decision: 走薄桥（方案 A）在 ctx.tools 注册三工具，而非独立 MCP server 或纯技能
      rationale: 与 opencode 插件 1:1 映射、DSH 原生 API 直接支持、工作量最小；符合 RFC「薄桥而非重写」结论
      alternatives_considered: ["技能-only（丢失确定性门禁价值）", "独立 MCP server（过度设计，需额外进程）"]
    - id: DD-002
      decision: fallback 采用「全局 xp-gate → 优雅降级提示」，不做 vendored CLI 随包
      rationale: vendored CLI 过重、与 src/npm-package「零运行时依赖」冲突、且 pluginDir 解析不可靠；优雅降级对齐项目「工具缺失→SKIP 非 BLOCK」约定
      alternatives_considered: ["随包打进 xp-gate CLI（过重+零依赖冲突，被 Delphi R1 否决）"]
    - id: DD-003
      decision: execute 内用 ctx.shell.run（注入 shell）并透传沙箱策略，不用 node:child_process 直连；buildCommand 纯函数做 shq() 转义
      rationale: 获得协作式取消、超时、沙箱策略复用 + 防命令注入
      alternatives_considered: ["node:child_process exec（无取消/超时/沙箱）", "双引号插值（注入风险，被 Delphi R1 否决）"]
    - id: DD-004
      decision: 12 个 skills 随发布包经平台原生 bundledSkillDir（$DSH_BUNDLED_SKILL_DIR）分发，不做 customSkillDirs/cp
      rationale: dsh plugin add 后技能即可被 skill 工具自动发现，AC 不依赖手工操作
      alternatives_considered: ["customSkillDirs/cp（靠用户手工，被 Delphi R1 否决）"]

