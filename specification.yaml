    # ============================================================
    # REQ-575: prune 文件条目必须校验，非法条目要报告并忽略。
    # .xp-gate-powershell-prune-dirs 同时喂三个分母：测试发现、覆盖率、
    # 静态分析作用域，都由 _find_powershell_files 供数。所以一个坏条目不是"没剪掉"
    # 那么简单——它会静默缩小这三个分母，而配置文件看起来仍然合理：
    #   -name '*'      匹配每一个目录 -> 整棵树被剪掉 -> 门禁什么都没分析却仍 exit 0
    #   -name 'a/b'    什么都匹配不到（目录名不含分隔符）-> 静默空操作，看着像生效了
    # 规则：只有裸目录名被采纳；含分隔符、glob 元字符、或裸 . / .. 的条目
    # 在 stderr 上报告后忽略。必须报告而非静默丢弃——被忽略的条目是操作者
    # 需要看到的配置错误。
    # 该逻辑最先出现在"已安装副本"（~/.config/xp-gate/adapters/powershell.sh），
    # 领先于仓库且从未有过任何测试；此处连同测试一并收编。
    # ============================================================
    - id: REQ-575
      description: "PowerShell prune 文件只采纳裸目录名；glob、含分隔符、. 与 .. 的条目必须报告并忽略"
      priority: high
      acceptance_criteria:
        - id: AC-575-01
          criteria: glob 条目（如 *）不得剪掉整棵树；产品脚本仍被发现，且该条目在 stderr 被报告
          test_type: unit
        - id: AC-575-02
          criteria: 含路径分隔符的条目（如 src/generated）被报告并忽略，不得当作静默空操作
          test_type: unit
        - id: AC-575-03
          criteria: 裸 . 与 .. 条目被拒绝，且不妨碍其余发现
          test_type: unit
        - id: AC-575-04
          criteria: 合法的裸目录名仍被采纳并剪除，且在 stderr 上宣告（防止校验过度拒绝）
          test_type: unit

    # ============================================================
    # REQ-576: fail-closed 必须同时体现为「非零返回码」与 XP_G1_REASON 行。
    # pre-commit 的 powershell 分支是先按返回码 switch、reason 只用作文案：
    #     PS_G1_OUTPUT=$(...; run_static_analysis 2>&1) || PS_G1_EXIT=$?
    #     case "$PS_G1_EXIT" in
    #       0) echo "✅ PASSED - PowerShell code quality ..."
    # 所以带 reason 却 return 0 的 reason 会被丢弃，门禁打印 PASSED。
    # 实测（本需求修复前，作用域文件列了一条存在、一条缺失，扫描干净）：
    #     run_static_analysis -> RETURN CODE = 0
    # 即「产品代码可能逃出了门禁」被打印后丢弃，Gate 1 判通过。#571 引入了这个
    # 缺陷（发了 reason 但返回成功）。已安装副本此前已察觉，改为返回 3。
    # 另外：扫描中途抛异常时 pwsh 退出 1，而本适配器里 1 表示「有 findings」，
    # 于是分析崩溃被报成 lint 违规。必须区分开，走 fail-closed 的「无法验证」。
    # ============================================================
    - id: REQ-576
      description: "PowerShell 适配器在作用域条目缺失/扫描异常时必须返回非零码，且崩溃不得被报成 findings"
      priority: critical
      acceptance_criteria:
        - id: AC-576-01
          criteria: 作用域文件里的条目缺失但扫描干净时，run_static_analysis 必须返回非零码（不得为 0），且仍发出 analysis-path-missing 原因
          test_type: unit
        - id: AC-576-02
          criteria: 作用域文件存在但未声明任何路径时返回非零码（不得为 0）
          test_type: unit
        - id: AC-576-03
          criteria: 扫描抛出异常（片段 exit 3）必须映射为「无法验证」（exit 2）并回显捕获到的异常文本，不得落入 findings 的 exit 1
          test_type: unit
        - id: AC-576-04
          criteria: 作用域分析必须在 PSScriptAnalyzerSettings.psd1 确实存在时才传入 -Settings，缺失时改走不带 -Settings 的等价调用；
            不得对分析器调用使用 -ErrorAction SilentlyContinue；非终止错误必须提升为终止错误，
            并以区别于 findings 的 fail-closed 退出码报告，不得让空结果集读成干净通过
          test_type: unit

    # ============================================================
    # REQ-577: PowerShell 发现流程必须剪掉 AI/IDE 生成目录。
    # 内置剪枝列表（#538 起）覆盖 xp-gate 自身的产物目录，但不覆盖 AI 编码代理
    # 与 IDE 产生的目录：.xp-gate/（xp-gate 的报告/日志）、.vscode/、.idea/、
    # .qoder/。这些装的是工具生成的脚本而非产品代码，扫进去就同样污染
