    # ============================================================
    # REQ-574: Gate MW 校验证据必须与 .delphi-config.json 的席位绑定。
    # #423 让 Gate MW 校验 provenance 的“内部自洽性”：三角色、三个互异的
    # requested_model、三个互异的 resolved_model、channel 显式。但从未把证据
    # 与实际配置的席位比对，于是“内部完美、外部错误”的证据照样通过。
    #
    # 2026-10-22 实测事故：某次 code-walkthrough 跑在
    # s-deepseek-v4.1-flash / g-deepseek-v4-pro / doubao-seed-2.0-pro 上——
    # 三者都不是 .delphi-config.json 声明的席位（配置写的是三个 local-*）——
    # 而证据如实记录了该事实（channel: "external"），Gate MW 仍判 APPROVED。
    # 根因一：派发走 workflow 的 agent() 扇出，脚本硬编码模型，16 次运行
    # 读取配置 0 次；根因二：不变量是“互异”而非“就是那三个”，从网关上百个
