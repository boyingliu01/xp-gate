          test_type: unit

    # ============================================================
    # REQ-564: 质量分不能因为门禁被跳过而升高。
    # score = PASSED_COUNT / EFFECTIVE_TOTAL，而 EFFECTIVE_TOTAL = TOTAL - SKIPPED，
    # 于是 SKIP 从分母里消失而不是计入扣分。按已发布公式算：
    #   1 过 11 跳 -> 有效 1 -> 10.0   |   3 过 9 跳 -> 有效 3 -> 10.0
    #   10 过 2 跳 -> 有效 10 -> 10.0
    # 只跑 12 道里 1 道，与跑 10 道报同一个 10.0/10。这不是假设：
    # .quality-history.jsonl 最近 100 次里 Gate 3 只跑了 7%、Gate 4 只跑了 8%，
    # 而这些运行全部记录了 score 10 / effectivePassRate 100 —— 跳过反而加分。
    # verdict 已有 SKIP-ALL 保护，缺口只在 score/effectivePassRate 这两个没带
    # 任何限定语、却被当作可跨运行比较的数字上。
    # ============================================================
    - id: REQ-564
      description: "质量报告必须同时给出跳过计入分母的全量分与真正执行的门禁数，使跳过无法抬高分数"
      priority: high
      acceptance_criteria:
        - id: AC-564-01
          criteria: 报告 overall 里存在数值型的 scoreAllGates（pass/total*10）与 gatesRan，
            且 gatesRan == gatesTotal - gatesSkipped
          test_type: unit
        - id: AC-564-02
          criteria: 同一批门禁，执行得越多 scoreAllGates 越高；且 scoreAllGates 严格小于
            有效分（只要存在跳过），从而无法被跳过抬高
          test_type: unit
        - id: AC-564-03
          criteria: 全部门禁 SKIP 时 verdict 为 SKIP-ALL、有效分为 null（沿用 issue 507 的
            number-or-null 契约）、gatesRan 为 0，绝不呈现伪造的满分
          test_type: unit

