    #   - 把分支改名为 feature 后那 4 个通过了，但另外 3 个挂了，因为「已发布」由
    #         git merge-base --is-ancestor <tag-commit> origin/main
    #     判定，只有 feature 的远程没有 origin/main（ok=4/7）。
    # 两半都是承重的。fixture 现在保持 feature 分支名，并显式把基线发布到 refs/heads/main。
    # ============================================================
    - id: REQ-598
