# Checkov configuration for XP-Gate
# https://www.checkov.io/
#
# This config is intentionally minimal — all checks are run by default.
# Populate the sections below to customize behavior.

quiet: true
compact: true
soft-fail: true

# Skip specific checks (populate with CKV IDs you want to exclude)
# skip_check: []

# File patterns to exclude from scanning
# skip_file: []

# Severity threshold — only report findings at or above this level
# severity: "high"

# Frameworks to enable (comma-separated). Empty = auto-detect from changed files
# framework:
#   - kubernetes
#   - dockerfile
#   - github_actions
#   - terraform
