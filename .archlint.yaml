# yaml-language-server: $schema=https://raw.githubusercontent.com/archlinter/archlint/main/resources/archlint.schema.json
#
# archlint ignore rules
#
# Test code is first-class: test files are NOT excluded from architecture checks.
# They participate in all archlint analyses just like production code.
# Only synthetic fixtures, generated output, and known-dedup mirrors are excluded.
#
# Build artifacts and sync mirrors: anything produced by a generator
# (tsc compilation, npm-package sync, plugin bundling) is a deliberate
# byte-for-byte copy of a source. archlint cannot tell mirrors from clones,
# so we exclude every generated tree to keep its Code Clone detector honest.
# Source-of-truth files are still scanned; only their generated copies are
# skipped. See src/npm-package/scripts/sync-package-content.js for the
# authoritative source→mirror mapping.
ignore:
# Test fixtures (synthetic test data, not test code)
- '**/__fixtures__/**'
- '**/__snapshots__/**'

# tsc compilation output (tsconfig.json: outDir=./dist, rootDir=./src)
- 'dist/**'

# Coverage reports (vitest/c8 generated)
- 'coverage/**'

# Stryker mutation-test temp dir
- '.stryker-tmp/**'

# npm-package mirrors generated by src/npm-package/scripts/sync-package-content.js
# Sources of truth live in skills/ and plugins/ at repo root.
- 'src/npm-package/skills/**'
- 'src/npm-package/plugins/**'

# adapter + hook duplication between githooks/ and src/npm-package/
# Documented as "known tech debt" in src/npm-package/AGENTS.md and root README.
# Source of truth: githooks/adapters/ and githooks/{pre-commit,pre-push,adapter-common.sh}
- 'src/npm-package/adapters/**'
- 'src/npm-package/hooks/**'

# Per-rule configuration
#
# code_clone detector reports a single smell that pairs each clone with its
# mirror. Ignoring only the generated mirror leaves a smell whose locations
# include the source-of-truth side, so archlint still reports it as HIGH.
# Adding the source side to code_clone.exclude tells the detector to skip
# these specific files entirely. code_clone is still active for every other
# file in the repo — only the known sync-script mirror pairs are exempt.
# Mirror map authoritative source: src/npm-package/scripts/sync-package-content.js
rules:
  code_clone:
    severity: high
    exclude:
    - 'plugins/**/*.ts'
    - 'plugins/**/*.js'
    - 'skills/**'
    - 'githooks/adapters/**'
    - 'githooks/pre-commit'
    - 'githooks/pre-push'
    - 'githooks/adapter-common.sh'
    # Mirror trees: src/npm-package/*/ are sync copies of src/*
    - 'src/npm-package/principles/**'
    - 'src/npm-package/mock-policy/**'
    - 'src/npm-package/mutation/**'
    - 'src/npm-package/debugger/**'
    - 'src/npm-package/architecture/**'
    - 'src/npm-package/rules/**'
